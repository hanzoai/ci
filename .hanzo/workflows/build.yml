# Hanzo CI/CD — reusable build + test + publish, driven by the caller repo's root
# hanzo.yml. Runs on the git.hanzo.ai `git-runner` fleet; pulls registry + kubeconfig
# creds from KMS via Universal Auth at run time. Public so any org can import it
# with `uses: hanzoai/ci/.hanzo/workflows/build.yml@v1` + `secrets: inherit`.
#
# THE DEFINITION LIVES HERE, AND ONLY HERE. There is no second address and no
# forwarder. Nothing runs on github.com, so the rule that used to force the split
# — github.com resolves a local reusable (`uses: ./…`) only out of
# `.github/workflows` — buys nothing, and the hop it forced was the thing
# breaking the forge: a caller naming a forwarder made git.hanzo.ai take a second
# hop it cannot take, and the run expanded into jobs with no labels, no steps and
# no runner, reporting `failure` with nothing to read. Every cicd lane in the
# fleet sat red that way — insights, cloud, universe and this repo — while the
# deploy lanes, which name their runner directly, stayed green and hid it.
#
# One file means nothing to keep in sync. The two copies drifted inside a day
# when both held one — twenty lines landed in one and not the other — and the
# forwarder that replaced the copy traded that drift for a hop that does not
# resolve. hanzo.yml's `one-definition` gate now asserts the simple thing: the
# pipeline is here, it holds steps, and no workflow has reappeared under
# `.github/workflows` to become a second address.
#
# The caller is ~7 lines (triggers + this `uses:`); all real config is hanzo.yml.
name: Hanzo CI/CD

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner labels as a JSON array. Default = the Hanzo `git-runner` fleet
          on git.hanzo.ai, which is the ONLY pool serving these labels (we run
          the build, metered as build minutes). Bring-your-own: pass the labels
          of your own self-hosted runners instead. There is no arc pool: arc
          (arcd) was retired 2026-08-01 and no label here was ever served by it.
        type: string
        default: '["hanzo-build-linux-amd64"]'
      mode:
        description: >-
          Where the IMAGE is built. `buildx` (default) builds it on this runner.
          `delegate` POSTs it to platform.hanzo.ai (`/v1/runner`), which builds
          in-cluster with BuildKit and rolls the operator Service CR itself.
          A repo opts in with `with: { mode: delegate }` and needs the
          `PLATFORM_BUILD_CALLBACK_TOKEN` secret (via secrets: inherit).

          THE GATE RUNS IN BOTH MODES, and that is the whole point of the input
          being named for the build. `delegate` used to be evaluated fourth, ahead
          of every toolchain and ahead of `test:`, so it skipped the gate along
          with the build — 20 steps skipped, 0 executed, green. What a delegated
          run skips is buildx, publish and deploy. It does not skip being tested.
        type: string
        default: buildx
      tests:
        description: >-
          Run the `test:` block. Default true, and a caller should leave it that
          way. 'false' asserts that THIS EXACT COMMIT was already gated before this
          run — it does not mean "ship untested". The one shape that holds today
          is hanzoai/cloud's release: clients/platform/release.go mints the v* tag
          only after that SHA passed the gate on main AND built AND smoked, so the
          tag build would re-test a commit already proven, at the cost of a
          3108-package link storm. Passing 'false' there runs the gate once instead
          of twice; passing it anywhere else runs it zero times.

          STRING, NOT BOOLEAN, AND THAT IS LOAD-BEARING. git.hanzo.ai resolves
          EVERY `type: boolean` workflow_call input to false — not just an omitted
          one carrying a default, but an explicitly passed `true` as well. Measured
          in isolation (z/inputprobe, runs 27365 and 27382): with `type: boolean,
          default: true` and a caller that omits it, `inputs.tests` printed
          `false`; a caller passing `with: {tests: true}` printed `false` too;
          inverting the polarity to a `skip_tests` boolean printed `false` when
          `true` was passed. String inputs in the SAME probe resolved correctly —
          `mode` printed `buildx` and `runner` printed its full JSON array from
          their declared defaults.

          So for as long as this input was a boolean, `if: ... && inputs.tests` was
          false on EVERY run, and the step below never executed. That is not a
          hypothetical: on 2026-08-04 the last two `cicd.yml` runs of hanzoai/cloud,
          commerce, console, gateway, hanzo.ai AND hanzoai/ci itself all reported
          completed/success with `Test (per hanzo.yml)` = skipped. Every `test:`
          block in the fleet was declared, was read, and had never once run — a
          green over zero tests, which the step below exists specifically to refuse
          when a SUITE is empty, and which had swallowed the whole gate.

          A string sidesteps it on both planes with identical meaning, and the
          comparison is against 'false' rather than a truthiness test so that the
          expression callers already write — hanzoai/cloud's
          `tests:` set from `github.ref_type != 'tag'`, which renders the strings
          "true"/"false" — keeps working unchanged.
        type: string
        default: 'true'
      submodules:
        description: >-
          Passed straight to actions/checkout. Default '' is checkout's own
          default — submodules are NOT fetched — so every existing caller keeps
          the checkout it has today. A repo whose source includes submodules
          passes 'recursive'.

          Why this is an input and not simply always-on: a build that omits part
          of its own source is wrong, but a submodule the job's token cannot read
          turns a build that succeeds today into one that fails at checkout. The
          repo knows which of those it has; this workflow does not.

          It matters more than it looks. A missing submodule does not announce
          itself — the directory is empty, every other file builds, and the
          artifact ships with a hole in it. hanzo-docs/docs is the case in hand:
          whole doc sections live in submodules, so it passes 'recursive' and
          gates the result (see that repo's scripts/check-export.sh).
        type: string
        default: ''

permissions:
  contents: write # release assets for `binaries:`; read is enough without it
  packages: write

jobs:
  cicd:
    runs-on: ${{ fromJson(inputs.runner) }}
    env:
      # corepack fetches the pnpm/yarn TARBALL ITSELF from registry.npmjs.org,
      # and it does not read .npmrc to do it — so 317 repos that pin
      # `packageManager` reach out to npmjs on every install no matter how
      # carefully their registry is configured. This is the one variable that
      # closes that hole; without it "installs go through our registry" is true
      # of the dependencies and false of the package manager fetching them.
      COREPACK_NPM_REGISTRY: https://pkg.hanzo.ai
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - name: Check out this reusable's own tools
        # A reusable workflow's `run:` steps execute in the CALLER's workspace, so
        # bin/imgver is not on disk unless we fetch it. Pinned to the ref this
        # workflow was IMPORTED at, so the script and the pipeline calling it are
        # always the same version: a caller on @v1 gets v1's imgver, not main's.
        # Both forges are tried because this same file is served from
        # github.com/hanzoai/ci and git.hanzo.ai/hanzo/ci, and a caller may run on
        # either.
        #
        # Every clone attempt REPORTS. This step used to send both to /dev/null and
        # print only "could not fetch", which named neither the ref it derived nor
        # which host refused — so the failure could only be guessed at from source.
        run: |
          set -euo pipefail
          echo "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF:-<unset>}"
          # `:-` on the FIRST expansion. GITHUB_WORKFLOW_REF is unset on this forge
          # (proven: the step printed `GITHUB_WORKFLOW_REF=<unset>`), and under
          # `set -u` a bare ${GITHUB_WORKFLOW_REF##*@} is an unbound-variable error
          # that killed the step on this line -- before any clone was attempted, so
          # the "could not fetch" message never even ran and every host looked
          # blameless. The default was already there on the last expansion; it was
          # unreachable.
          raw="${GITHUB_WORKFLOW_REF:-}"
          ref="${raw##*@}"; ref="${ref#refs/heads/}"; ref="${ref#refs/tags/}"; ref="${ref:-v1}"
          echo "derived ref=${ref}"
          # The forge first, because the forge is where this repo is written and
          # GitHub is its mirror. `hanzo/ci` IS NOT THIS REPO and is gone from the
          # list: it is the tenant-org fork, whose v1 carries no bin/ at all, and
          # it sat SECOND — so on any run where github.com was unreachable it
          # cloned, the loop broke on that success, and the job died on "could not
          # fetch (bin/imgver)" having never reached hanzoai/ci third. Namespaces
          # are not interchangeable: hanzoai/* is the mirror namespace this repo
          # lives in, hanzo/* is a tenant that happens to hold an old fork.
          #
          # The break therefore tests for the TOOL rather than for the clone, so a
          # host that answers with the wrong tree falls through to the next.
          for url in https://git.hanzo.ai/hanzoai/ci https://github.com/hanzoai/ci; do
            echo "::group::clone ${url}@${ref}"
            if git clone -q --depth 1 --branch "$ref" "$url" "$RUNNER_TEMP/ci" \
               && [ -x "$RUNNER_TEMP/ci/bin/imgver" ]; then
              echo "cloned ${url}@${ref}"; echo "::endgroup::"; break
            fi
            echo "failed ${url}@${ref}"; echo "::endgroup::"
            rm -rf "$RUNNER_TEMP/ci"
          done
          [ -x "$RUNNER_TEMP/ci/bin/imgver" ] \
            || { echo "::error::could not fetch hanzoai/ci@${ref} (bin/imgver) from any host"; exit 1; }
          echo "CI_HOME=$RUNNER_TEMP/ci" >> "$GITHUB_ENV"

      - name: Structural invariants (the repo agrees with itself)
        # Two cheap refusals, run before anything is built or pushed, for a
        # defect class no later stage can see: a declaration and the reality it
        # describes disagreeing in silence.
        #
        #   ignoretracked — content the repo's OWN .gitignore matches but the
        #     index still tracks. An ignore rule does not untrack what is
        #     already tracked, so the bulk ships in every release while
        #     `git status` stays clean. hanzoai/cloud carried 361 MB this way
        #     for 6 days — past Go's 500 MiB module-zip ceiling, making nine
        #     consecutive releases unfetchable by every consumer.
        #   modsize — each Go module tree measured against that same ceiling,
        #     nested modules separately. Past it, `go get` fails everywhere
        #     with 'module source tree too large'; near it, this is the only
        #     warning anyone gets before the first consumer breaks.
        #   conflictmarkers — a merge that was committed unresolved. `git add`
        #     accepts a file that still carries git's own markers, and from then
        #     on they are ordinary content: status clean, diff empty, both sides
        #     of the merge shipping. It hides in generated and vendored files,
        #     which are large, rarely opened and effectively unreviewed —
        #     hanzoai/base carried ` / `>>>>>>> upstream/master` at
        #     lines 23807 and 23850 of a committed .d.ts. No compiler catches it
        #     there: a .d.ts nothing imports is never parsed, and in YAML, JSON,
        #     Markdown and every config format we ship the markers are silently
        #     VALID content.
        #   vendormark — a site-generator vendor's branding left in the tree.
        #     Several sites began as output from a hosted "prompt to React app"
        #     generator, which signs its work in four places at once: an asset
        #     folder named after the vendor (so its name is in every image URL,
        #     and on one site in the FAVICON, so it was in every browser tab), a
        #     build plugin in package.json, an injected third-party <script>,
        #     and the commit messages, author identities and Co-authored-by
        #     trailers of its bot. The last survives any amount of tidying the
        #     working tree — a repo can render a perfect page and still say in
        #     `git log` who really wrote it. Removing it needed a history
        #     rewrite and a force-push of every branch; this is so that is never
        #     needed twice.
        #
        # Both proven RED against cloud@v1.801.424 (the real outage) and GREEN
        # against the repaired tree before landing here. They read the checkout
        # only — no network, subsecond on a healthy repo — and they FAIL the
        # run rather than annotate it, because a warning nobody reads is the
        # same silence one level up.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ci/bin/ignoretracked" .
          "$RUNNER_TEMP/ci/bin/modsize" .
          "$RUNNER_TEMP/ci/bin/conflictmarkers" .
          "$RUNNER_TEMP/ci/bin/vendormark" .

      - name: Provision parse toolchain (jq + PyYAML)
        # This reusable parses the caller's hanzo.yml with python3 + PyYAML and
        # slices JSON with jq. A minimal runner image
        # may ship NEITHER (the fleet default, catthehacker/ubuntu:act-24.04, does),
        # so provision them here. Guarded (a no-op the moment a runner image bakes
        # them in) — this keeps the reusable self-contained: any org can import it
        # onto a bare runner and it just works.
        run: |
          set -e
          # Sudo-free FIRST (bare runner nodes often lack passwordless sudo / apt
          # network — `sudo apt-get` then dies with no captured logs). Install jq
          # as a static binary and PyYAML via pip --user into ~/.local/bin; fall
          # back to apt only if those are unavailable. Works on bare AND baked nodes.
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! command -v jq >/dev/null 2>&1; then
            curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
              -o "$HOME/.local/bin/jq" && chmod +x "$HOME/.local/bin/jq" \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          fi
          # yq (mikefarah) — static Go binary, curl-installed like jq. Replaces the
          # PyYAML/python3 YAML parse that could not be provisioned on locked-down
          # locked-down nodes (sudo blocked by no_new_privs, pip/PyPI unavailable).
          if ! command -v yq >/dev/null 2>&1; then
            curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
              -o "$HOME/.local/bin/yq" && chmod +x "$HOME/.local/bin/yq"
          fi
          jq --version
          yq --version

      - name: Authenticated git for go modules (rate-limit + any private repo)
        # luxfi/hanzoai/zooai Go modules are PUBLIC, so `go` resolves them through
        # the default public proxy (proxy.golang.org) + checksum db (sum.golang.org)
        # — canonical, IMMUTABLE hashes that a force-moved tag can no longer break.
        # We deliberately do NOT set GOPRIVATE: that would route these public
        # modules `direct` and bypass the sumdb, re-introducing the re-publish
        # poisoning we just removed. This step only adds a GH_PAT git credential so
        # the proxy's `direct` fallback (and any genuinely-private repo added later,
        # via a narrow GOPRIVATE) authenticates instead of hitting the anon rate
        # limit. No-op when GH_PAT is absent.
        #
        # Robustness (learned the hard way in hanzoai/iam): a plain
        # `git config --global` is defeated on shared self-hosted runners by
        # (a) a stale insteadOf/credential left in ~/.gitconfig by a prior run and
        # (b) actions/checkout's persisted http.<github>.extraheader (the repo-
        # scoped GITHUB_TOKEN) in the checked-out repo's local config. So use a
        # FRESH per-job GIT_CONFIG_GLOBAL + GIT_CONFIG_NOSYSTEM=1 and verify from
        # a NEUTRAL dir (matches where go clones modules — GOMODCACHE).
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "GH_PAT not set — public proxy+sumdb handles everything"; exit 0
          fi
          CFG="$RUNNER_TEMP/gitconfig-private"; : > "$CFG"
          GIT_CONFIG_GLOBAL="$CFG" git config --global \
            url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          {
            echo "GIT_CONFIG_GLOBAL=$CFG"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          ( cd "$RUNNER_TEMP" && GIT_CONFIG_GLOBAL="$CFG" GIT_CONFIG_NOSYSTEM=1 \
              git ls-remote https://github.com/hanzoai/authz >/dev/null 2>&1 ) \
            && echo "git auth OK" \
            || echo "::warning::GH_PAT set but repo probe failed"

      - name: Log in to GHCR (GH_PAT when present, else automatic token)
        if: inputs.mode != 'delegate'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        # GH_PAT is zeekay's PAT (org owner: write on every package, no
        # per-package grants to lose). It can push or CREATE any <org> package
        # regardless of which repo the package is linked to. The per-job GITHUB_TOKEN only writes a package linked to THIS
        # repo, so it 403s on a package created/linked elsewhere (e.g.
        # ghcr.io/hanzoai/cms). Fall back to the automatic token when GH_PAT is
        # absent (public forks like zooai/node that create their own repo-linked
        # package on first push).
        run: |
          if [ -n "${GH_PAT:-}" ]; then
            echo "$GH_PAT" | docker login ghcr.io -u zeekay --password-stdin
          else
            # SAY IT. This branch is the one that cost a day.
            #
            # The automatic token writes ONLY a package linked to this repo. That
            # covers most of them, so the fallback works almost always and the
            # almost is invisible: nothing here mentions which credential won,
            # and the consequence surfaces twenty stages later as
            #
            #   denied: permission_denied: The token provided does not match expected scopes
            #
            # which reads as a broken token, a broken registry, or a broken repo
            # — anything but "we quietly signed in as somebody else at step 3".
            # An UNLINKED package hits it every time, and a package comes unlinked
            # for a reason nobody remembers: its repo changed orgs. hanzoai/id
            # moved to hanzo-inc, and from then on every one of its builds ran
            # green through sixteen Docker stages and died at the push.
            #
            # A warning, not a refusal: public forks legitimately land here and
            # create their own repo-linked package on first push. The fix is that
            # the log now names the door it went through.
            echo "::warning::GH_PAT is empty — pushing with the automatic token, which can write ONLY a package linked to this repo. An unlinked package will fail at push with 'does not match expected scopes'."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Fetch deploy credentials from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
          KMS_ORG: ${{ vars.KMS_ORG }}
        run: |
          # This step is BEST-EFFORT (see below): GHCR push already works via the
          # workflow token, and deploy creds are optional. GitHub wraps `run:` in
          # `bash -eo pipefail`, so we MUST explicitly `set +e` — otherwise an
          # unguarded curl (e.g. a KMS secret 404 at this org/path) aborts the
          # step and fails the whole build. Keep -u/-o pipefail; drop -e.
          set +e
          set -uo pipefail
          # Canonical luxfi/kms surface — /v1/kms (the Infisical /api/* surface was
          # removed when KMS migrated to luxfi/kms, MPC-rooted). Auth = an IAM
          # client_credentials JWT minted by the per-org `<org>-kms` application;
          # secrets are org-scoped and fetched one at a time (no bulk /secrets/raw).
          #
          # This step is BEST-EFFORT: the automatic workflow token already
          # authorizes GHCR push, so a repo with no cross-org private deps and no
          # deploy can build without KMS. KMS provides only:
          #   GITHUB_TOKEN — a cross-org PAT for cloning OTHER orgs' private Go
          #     modules (luxfi/dex, luxfi/precompile from a zooai build), which the
          #     repo-scoped automatic token cannot read. Handed to buildx as the
          #     `gh_token` BuildKit secret.
          #   KUBECONFIG  — reads the registry credential out of the cluster so
          #     an image can also reach oci.hanzo.ai.
          ORG="$(yq -r '.kms.org // ""' hanzo.yml 2>/dev/null || true)"
          : "${ORG:=${KMS_ORG:-}}"
          # Systemic default: when neither hanzo.yml `kms.org` nor the KMS_ORG var
          # is set, derive the KMS org from the GitHub owner. The org → KMS-org
          # relation is a small, stable first-party fact; keeping it here (ONE
          # place) is why every repo gets the canonical KMS deploy-cred path with
          # zero per-repo config — before this, ORG was always empty and this whole
          # step short-circuited, so no build ever fetched its private-dep git
          # credential from KMS (it silently fell back to GH_PAT and failed on
          # private hanzoai/cloud). hanzo.yml `kms.org` and KMS_ORG still override.
          if [ -z "$ORG" ]; then
            # A brand owns MANY GitHub orgs and exactly one KMS tenant. hanzo-inc,
            # hanzo-apps, hanzo-js, hanzo-go, hanzo-rs, hanzo-cpp, hanzogui and
            # hanzos3 all bill and seal to KMS org `hanzo`, the same as hanzoai.
            # Matching the family by prefix rather than listing the orgs is what
            # keeps a NEW org from being a silent outage: enumerating them meant
            # every org added after this line fell through to the literal owner,
            # which is not a KMS org, and the build then looked for its deploy
            # credential at a tenant that does not exist. That failure LOOKS fine
            # — the read below takes its org from the TOKEN, not the URL — so only
            # the fallback URL and the error messages were wrong, and they sent
            # the reader hunting a tenant instead of a credential.
            case "${{ github.repository_owner }}" in
              hanzo*)  ORG=hanzo ;;
              lux*)    ORG=lux ;;
              zoo*)    ORG=zoo ;;
              *)       ORG="${{ github.repository_owner }}" ;;
            esac
          fi
          ENV="$(yq -r '.kms.environment // "prod"' hanzo.yml 2>/dev/null || echo prod)"
          PATHQ="$(yq -r '.kms.path // "/deploy"' hanzo.yml | sed 's#^/##; s#/$##' 2>/dev/null || echo deploy)"
          # A repo that DECLARES `build_secrets` has asserted its image is not
          # valid without them, so for that repo KMS is REQUIRED, not best-effort.
          # Read the declaration BEFORE the two short-circuits below: otherwise an
          # unconfigured or unreachable KMS returns "no secrets" and the build
          # proceeds to bake an EMPTY credential — green run, broken artifact. That
          # is exactly how docs/chat/app shipped bundles that could not write, and
          # how a stale key survived: every failure looked like "not in KMS", and
          # "not in KMS" was survivable.
          DECLARED="$(yq -r '[(.images // [])[] | (.build_secrets // [])[]] | unique | .[]' hanzo.yml 2>/dev/null || true)"
          # A build_secret becomes `--build-arg NAME=value` below, and a build-arg
          # is IN THE PUBLISHED IMAGE — `docker history` prints it to anyone who
          # can pull. So `build_secrets` can only ever carry values that are
          # public on purpose: a Vite/Next SPA has no server to read an env from,
          # so its ingest key must be inlined at build, and inlining it is what
          # publishing it means. Every other value must not be here at all.
          #
          # Nothing checked that. The one repo whose value is genuinely
          # publishable (hanzoai/ui, a `pk-…` ingest key) asserted the `pk-`
          # prefix INSIDE ITS OWN Dockerfile — so the check existed once, for one
          # image, and any repo that added a real credential got no check at all.
          # Per-repo vigilance is not a mechanism; the assertion belongs here,
          # where the build-arg is assembled, once, for every caller.
          #
          # INLINE, not "$CI_HOME/bin/publishable", and that is forced rather than
          # chosen. The tools checkout and this workflow resolve from DIFFERENT
          # places: the caller pins the workflow at a ref its forge resolves, while
          # the tools step derives its ref from GITHUB_WORKFLOW_REF — which
          # git.hanzo.ai does not set, so it falls back to `v1` and clones
          # github.com. Measured on run 36473: `GITHUB_WORKFLOW_REF=<unset>`,
          # `derived ref=v1`, `cloned https://github.com/hanzoai/ci@v1`. A step
          # that calls a NEW file under $CI_HOME is therefore broken on every forge
          # run until a tag moves on a host this repo is not even pinned to.
          #
          # The rule is also spelled in bin/publishable, which the `publishable`
          # gate tests. Two spellings of one rule is the same shape as the two
          # copies of this file, and it gets the same treatment: a gate refuses
          # any difference between them. See `publishable-rule-is-one-rule`.
          for bs in $DECLARED; do
            case "$bs" in
              PUBLISHABLE_*|PUBLIC_*|NEXT_PUBLIC_*|EXPO_PUBLIC_*|NUXT_PUBLIC_*|VITE_*|REACT_APP_*|*_PUBLISHABLE|*_PUBLIC) ;;
              *) echo "::error::build_secret '$bs' does not declare itself publishable, and a build_secret is baked into the image as a --build-arg where \`docker history\` reveals it. Rename it (PUBLISHABLE_*, PUBLIC_*, NEXT_PUBLIC_*, VITE_*, REACT_APP_*) if the value is public on purpose; if it is a real credential it cannot be a build_secret at all."; exit 1 ;;
            esac
          done
          required() { [ -n "$DECLARED" ]; }
          if [ -z "${KMS_CLIENT_ID:-}" ] || [ -z "$ORG" ]; then
            if required; then
              echo "::error::KMS not configured (no KMS_CLIENT_ID or org) but hanzo.yml declares build_secrets:$(echo " $DECLARED" | tr '\n' ' ')— refusing to build an image with empty credentials"; exit 1
            fi
            echo "::notice::KMS not configured (no KMS_CLIENT_ID or org) — skipping; GHCR push uses the workflow token"; exit 0
          fi
          TOKEN=$(curl -sf "$KMS_ENDPOINT/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" | jq -r '.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            if required; then
              echo "::error::KMS login failed (endpoint=$KMS_ENDPOINT org=$ORG client=$KMS_CLIENT_ID) but hanzo.yml declares build_secrets — refusing to build an image with empty credentials"; exit 1
            fi
            echo "::warning::KMS login failed (org=$ORG client=$KMS_CLIENT_ID) — cross-org private deps & deploy unavailable"; exit 0
          fi
          # Embedded KMS (HIP-0106): org from the token, flat {"value"}. The old
          # /v1/kms/orgs/<org>/... + .secret.value pair 404s and `curl -sf` turns
          # that into "" — which every caller reads as "not in KMS". The standalone
          # host also holds a STALE key cloud 403s, so reading it ships a dead one.
          # Embedded first, standalone as fallback.
          get() {
            v=$(curl -sf "$KMS_ENDPOINT/v1/kms/secrets/$PATHQ/$1?env=$ENV" -H "Authorization: Bearer $TOKEN" | jq -r '.value // empty')
            if [ -z "$v" ]; then
              v=$(curl -sf "$KMS_ENDPOINT/v1/kms/orgs/$ORG/secrets/$PATHQ/$1?env=$ENV" -H "Authorization: Bearer $TOKEN" | jq -r '.secret.value // empty')
            fi
            printf '%s' "$v"
          }
          # Cross-org private Go module read token → buildx `gh_token` secret.
          # GIT_TOKEN is not a reserved name, so it's safe in GITHUB_ENV.
          GIT_TOKEN=$(get GITHUB_TOKEN)
          if [ -n "$GIT_TOKEN" ]; then echo "::add-mask::$GIT_TOKEN"; echo "GIT_TOKEN=$GIT_TOKEN" >> "$GITHUB_ENV"; fi
          KUBECONFIG_B64=$(get KUBECONFIG)
          if [ -n "$KUBECONFIG_B64" ]; then echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"; echo "kubeconfig=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_OUTPUT"; fi
          # The REGISTRY credential, and it is fetched UNCONDITIONALLY because
          # every repo that publishes an image needs it — which is most of them.
          #
          # It used to sit inside the `bucket:`/`site:` gate below, and that gate
          # is about writing bytes to hanzoai/s3, a completely unrelated lane. So
          # a repo declaring only `images:` — hanzoai/bot, and it is not alone —
          # asked KMS for nothing and reached the docker login step with empty
          # credentials. The build then failed at the push with no clue pointing
          # here, and the obvious "fix" is to paste REGISTRY_USER/REGISTRY_PASSWORD
          # into the forge's org secrets, which is exactly the CI-only copy the
          # comment below warns about: a second thing to rotate, and the one
          # nobody remembers. The contract is that the ONLY things living in the
          # forge are KMS_CLIENT_ID/SECRET, so the fetch moves out of the gate
          # rather than the credential moving into GitHub.
          #
          # Empty is harmless: nothing is exported when KMS has no such key, and
          # the login step already falls back to the kubeconfig read for repos
          # provisioned before these names existed.
          for k in REGISTRY_USER REGISTRY_PASSWORD; do
            v=$(get "$k")
            if [ -n "$v" ]; then
              [ "$k" = REGISTRY_PASSWORD ] && echo "::add-mask::$v"
              echo "$k=$v" >> "$GITHUB_ENV"
            fi
          done
          # Object-store credential, for the ONE lane that writes bytes to
          # hanzoai/s3 itself: a repo publishing `binaries:` to a bucket:. Same
          # names the services read at run time, from the same org/path/env — a
          # CI-only copy of a credential is a second thing to rotate and the one
          # nobody remembers.
          #
          # `site:` used to be fetched here too, and that is exactly what killed
          # it: S3_ADMIN_ACCESS_KEY/S3_ADMIN_SECRET_KEY are not in KMS for any
          # org, so the site lane's fail-closed check refused every caller that
          # ever declared one. The site lane no longer touches S3 — it hands the
          # zip to cloud and cloud writes the bytes — so the credential it cannot
          # have is one it no longer needs.
          SITE_DECL="$(yq -r '.site | type' hanzo.yml 2>/dev/null || echo '!!null')"
          if [ -n "$(yq -r '.bucket // ""' hanzo.yml 2>/dev/null || true)" ]; then
            for k in S3_ADMIN_ACCESS_KEY S3_ADMIN_SECRET_KEY; do
              v=$(get "$k")
              if [ -n "$v" ]; then echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; fi
            done
            # Endpoint and region are NOT masked: both appear in every published
            # URL, and a redacted host turns the printed index into noise.
            for k in S3_PUBLIC_ENDPOINT S3_REGION S3_PUBLIC_SECURE; do
              v=$(get "$k")
              if [ -n "$v" ]; then echo "$k=$v" >> "$GITHUB_ENV"; fi
            done
          fi
          # `site:` needs exactly ONE thing from this step, and it is a thing this
          # step already has — there is one KMS login in this workflow and the
          # site lane does not add a second.
          #
          #   HANZO_API_TOKEN — the bearer for /v1/projects and /v1/sites. It is
          #     the token THIS STEP ALREADY MINTED: cloud's /v1/kms/auth/login is
          #     a broker that performs the IAM client_credentials exchange and
          #     "returns IAM's own JWT verbatim" (cloud apps/kms/login.go), scoped
          #     by its `owner` claim to exactly this org. api.hanzo.ai validates
          #     that same issuer and mints X-Org-Id from it. So the credential
          #     that reads this org's secrets and the credential that publishes
          #     this org's site are ONE machine identity, with one lifetime and
          #     one thing to rotate. It is masked here, before GITHUB_ENV is the
          #     first place it could surface.
          #
          # Neither the bucket nor the org is exported any more, because neither
          # is CI's to name. The org segment is prepended SERVER-side from the
          # validated principal and the bucket never appears in a request at all
          # (cloud apps/projects/blob.go:60, `sitePrefix(org, slug)`) — which is
          # precisely what makes the prefix unforgeable. CI passing them was CI
          # restating something it could only get wrong.
          if [ "$SITE_DECL" = '!!map' ]; then
            echo "::add-mask::$TOKEN"
            echo "HANZO_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          fi
          # Build-time secrets → --build-arg. A repo declares per-image
          # `build_secrets: [NAME, ...]` in hanzo.yml; each NAME is fetched from
          # the SAME org/path/env and exported (masked) so the build step bakes
          # it in as `--build-arg NAME=value`. The KMS key name IS the build-arg
          # name — one name, one place. For publishable client tokens a Vite SPA
          # must embed at build (e.g. VITE_MAPBOX_TOKEN). Undeclared → no-op, so
          # every existing repo is byte-for-byte unchanged.
          for bs in $DECLARED; do
            case "$bs" in ''|*[!A-Za-z0-9_]*) echo "::error::invalid build_secret name '$bs'"; exit 1;; esac
            v=$(get "$bs" || true)
            if [ -z "$v" ]; then
              # Fail CLOSED. An empty build-arg is indistinguishable from a missing
              # one at build time and only shows up as silence in production.
              echo "::error::build_secret $bs is not readable at $KMS_ENDPOINT ($ORG/$PATHQ env=$ENV) — refusing to bake an empty value. Seal it, or drop it from hanzo.yml build_secrets."; exit 1
            fi
            # A publishable key gets ASKED whether it still works, because present
            # and readable is not the same as usable and every check before this
            # one stops at present.
            #
            # This is the gap that took out hanzo.ai, cloud.hanzo.ai and
            # docs.hanzo.ai at once. The key they baked, pk-live-c886…, was sealed,
            # non-empty and correctly `pk-` shaped — it satisfied every gate in
            # this file and in each repo's Dockerfile — but its PROJECT had been
            # deleted, so the door answered 403 ingest_key_unknown and the sites
            # lost 100% of their events while every build stayed green. docs then
            # rebuilt cleanly on 08-06 and baked the same dead key again, because
            # nothing anywhere asks.
            #
            # Shape cannot see a deleted project; only the door knows. One POST
            # with an empty batch is a no-op that returns 200 for a live key, 403
            # for a key naming no project, 401 for one that cannot be read at all.
            #
            # Scoped to pk- values so it never fires on an unrelated build_secret,
            # and it fails CLOSED: a dead key is a broken artifact, not a warning.
            case "$v" in
              pk-*)
                code=$(curl -s -o /tmp/ingest_probe.json -w '%{http_code}' --max-time 20 \
                  -X POST "https://api.hanzo.ai/v1/event?ingest_key=$v" \
                  -H 'content-type: application/json' -d '{"batch":[]}' || echo 000)
                case "$code" in
                  200) echo "build_secret $bs resolves at the ingest door (200)" ;;
                  000) echo "::warning::could not reach the ingest door to check $bs; proceeding (network, not the key)" ;;
                  *)   echo "::error::build_secret $bs does not resolve: the door answered $code $(cat /tmp/ingest_probe.json 2>/dev/null). Baking it ships an image that drops every event. Rotate the KMS value, then rebuild."; exit 1 ;;
                esac
                ;;
            esac
            echo "::add-mask::$v"
            { echo "$bs<<__KMS_BUILDARG_EOF__"; echo "$v"; echo "__KMS_BUILDARG_EOF__"; } >> "$GITHUB_ENV"
          done

      - name: GHCR push credential (KMS write:packages token)
        if: inputs.mode != 'delegate'
        env:
          KUBECONFIG: ${{ steps.kms.outputs.kubeconfig }}
        # The per-job GITHUB_TOKEN — and a package-less GH_PAT — can only push a
        # package LINKED to this repo, so they 403 on a package created/linked
        # elsewhere (ghcr.io/hanzoai/cms). Upgrade the ghcr login to the org's
        # ghcr push token from the cluster (buildx-ghcr-auth, admin write:packages,
        # KMS-synced) when a kubeconfig is present — it pushes/creates ANY <org>
        # package. Fail-safe: keep the earlier login if anything is unavailable
        # (public forks with no KMS keep their repo-linked GITHUB_TOKEN push).
        run: |
          set -uo pipefail
          [ -z "${KUBECONFIG:-}" ] && { echo "::notice::no kubeconfig — keeping the earlier GHCR login"; exit 0; }
          command -v kubectl >/dev/null 2>&1 || {
            KVER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl" -o "$HOME/.local/bin/kubectl" && chmod +x "$HOME/.local/bin/kubectl"
            export PATH="$HOME/.local/bin:$PATH"
          }
          CFG=$(kubectl -n hanzo get secret buildx-ghcr-auth -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null | base64 -d || true)
          [ -z "$CFG" ] && { echo "::notice::buildx-ghcr-auth not readable — keeping the earlier GHCR login"; exit 0; }
          UP=$(echo "$CFG" | jq -r '.auths | to_entries[] | select(.key|test("ghcr")) | .value.auth' | head -1 | base64 -d 2>/dev/null || true)
          [ -z "$UP" ] && { echo "::notice::no ghcr auth in buildx-ghcr-auth — keeping the earlier login"; exit 0; }
          echo "::add-mask::${UP#*:}"
          if echo "${UP#*:}" | docker login ghcr.io -u "${UP%%:*}" --password-stdin; then
            echo "::notice::GHCR login upgraded to the KMS write:packages token"
          else
            echo "::notice::KMS GHCR token login failed — keeping the earlier login"
          fi

      # oci.hanzo.ai IS THE HOST. registry.hanzo.ai was its alias and stopped
      # resolving: /v2/ answers 404 there and 401 here, which is the difference
      # between "no registry" and "a registry asking who you are". Because this
      # step is best-effort by design — a mirror failure must not take the lane
      # red — every build in the fleet has been quietly pushing GHCR-only since,
      # logging a notice nobody reads. The credential needed no change: the
      # in-cluster registry-credentials dockerconfig already carries auth for
      # both names, and the jq below prefers the canonical one.
      - name: Native registry credential (oci.hanzo.ai)
        if: inputs.mode != 'delegate'
        env:
          KUBECONFIG: ${{ steps.kms.outputs.kubeconfig }}
          # KMS first (exported to GITHUB_ENV by the step above), GitHub secret
          # second. `env:` here cannot see GITHUB_ENV from THIS step's own env
          # block, so the KMS values are read out of the environment in `run:`.
          GH_REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          GH_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -uo pipefail
          # REGISTRY_USER/PASSWORD may already be in the environment from KMS.
          REGISTRY_USER="${REGISTRY_USER:-${GH_REGISTRY_USER:-}}"
          REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-${GH_REGISTRY_PASSWORD:-}}"
          # Direct credential first (repo/org secret — works on private repos,
          # where the Free plan hides org secrets... including these; private
          # repos set them at REPO level). KMS-kubeconfig read is the fallback.
          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
            # Best-effort: an oci.hanzo.ai login FAILURE (not just a missing
            # cred) must never fail the run — the image still pushes to GHCR, the
            # primary. Without this guard, bash -e aborts the step and SKIPS the
            # build entirely (a registry hiccup takes the whole lane red).
            if echo "$REGISTRY_PASSWORD" | docker login oci.hanzo.ai -u "$REGISTRY_USER" --password-stdin; then
              echo "MIRROR_OK=1" >> "$GITHUB_ENV"
            else
              echo "::notice::oci.hanzo.ai login failed — mirror skipped (GHCR-only push)"
            fi
            exit 0
          fi
          [ -z "${KUBECONFIG:-}" ] && { echo "::warning::no registry credential and no kubeconfig — image will NOT reach oci.hanzo.ai (ghcr only)"; exit 0; }
          # Bare runners ship no kubectl — same static provision the deploy
          # step uses.
          command -v kubectl >/dev/null 2>&1 || {
            KVER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"               -o "$HOME/.local/bin/kubectl" && chmod +x "$HOME/.local/bin/kubectl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.local/bin:$PATH"
          }
          CFG=$(kubectl -n hanzo get secret registry-credentials                   -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null | base64 -d || true)
          if [ -z "$CFG" ]; then
            echo "::warning::registry-credentials not readable from this kubeconfig — image will NOT reach oci.hanzo.ai (ghcr only)"; exit 0
          fi
          USERPASS=$(echo "$CFG" | jq -r '.auths["oci.hanzo.ai"].auth // .auths["oci.hanzo.ai"].auth // empty' | base64 -d)
          [ -z "$USERPASS" ] && { echo "::warning::no registry auth in dockerconfig — image will NOT reach oci.hanzo.ai (ghcr only)"; exit 0; }
          echo "::add-mask::${USERPASS#*:}"
          # Best-effort: login failure → skip mirror, never fail the run (see above).
          if echo "${USERPASS#*:}" | docker login oci.hanzo.ai -u "${USERPASS%%:*}" --password-stdin; then
            echo "MIRROR_OK=1" >> "$GITHUB_ENV"
          else
            echo "::notice::oci.hanzo.ai login failed — mirror skipped (GHCR-only push)"
          fi

      - name: Locate the Go module
        # WHICH go.mod, not just whether one exists. A POLYGLOT repo keeps its
        # module one level down — hanzoai/flags is `go/ python/ rust/
        # typescript/` — so a root-only look saw no Go, skipped the provision
        # below, and its `go test ./...` gate died with the exact
        # `go: command not found` that step exists to prevent. The Node gate
        # further down already reads `**/package.json` for this same reason.
        #
        # Root wins when present, so every repo with a top-level module resolves
        # exactly as before. vendor/ and node_modules/ are excluded because a
        # dependency's go.mod is not this repo's toolchain.
        id: gomod
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then
            f=go.mod
          else
            f=$(find . -name go.mod -not -path './vendor/*' -not -path '*/node_modules/*' 2>/dev/null \
                  | sed 's|^\./||' \
                  | awk '{ print gsub(/\//,"/") " " $0 }' \
                  | sort -n | head -1 | cut -d' ' -f2- || true)
          fi
          echo "file=${f}" >> "$GITHUB_OUTPUT"
          [ -n "${f}" ] && echo "go module: ${f}" || echo "no go module — Go gates will not be provisioned"

      - name: Provision Go toolchain (go test gates on bare runners)
        # hanzo.yml `test:` gates (e.g. `go vet ./...`, `go test ...`) run
        # DIRECTLY on the runner, NOT inside a build container — but the stock
        # runner image may ship no Go, so a Go
        # gate dies with `go: command not found` (exit 127). Provision the repo's
        # OWN Go version from its go.mod so the toolchain matches the module
        # exactly. Guarded to Go repos so pure-JS/TS callers are unaffected;
        # harmless if a future runner image bakes Go in.
        if: steps.gomod.outputs.file != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.gomod.outputs.file }}
          cache: false

      - name: Provision C toolchain (cgo test gates)
        # CGO_ENABLED=1 gates (e.g. go-sqlite3, which bundles the sqlite
        # amalgamation) need a C compiler; a minimal runner ships none
        # (`cgo: gcc not found`). Same guarded provision the parse-toolchain step
        # above uses — a no-op when gcc is already present. If apt-get update
        # fails (snapshot mirror rot: "no longer has a Release file"),
        # repoint archive.ubuntu.com at the DO mirror — both sources.list and
        # noble's deb822 ubuntu.sources — and retry once.
        if: steps.gomod.outputs.file != ''
        run: |
          command -v gcc >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq || {
            sudo find /etc/apt -name '*.list' -o -name '*.sources' | \
              xargs -r sudo sed -i 's|https\?://archive.ubuntu.com/ubuntu|http://mirrors.digitalocean.com/ubuntu|g'
            sudo apt-get update -qq
          }
          sudo apt-get install -y -qq gcc

      - name: Provision Node toolchain (JS test gates)
        # JS/TS `test:` gates (e.g. `pnpm install --frozen-lockfile && pnpm lint`)
        # also run DIRECTLY on the runner, and a minimal runner image ships
        # no Node — so the gate dies at `corepack: command not found` (exit 127)
        # before it ever reads package.json. Same guarded provision as the Go
        # step above: only for JS callers, harmless if a future runner image
        # bakes Node in. `corepack enable` shims the repo's own packageManager
        # (pnpm/yarn) at its pinned version.
        #
        # The glob is NESTED, not root-only. A Go repo whose JS lives in a
        # subtree is still a JS caller: hanzoai/commerce keeps its front ends in
        # app/ and declares `cd app && pnpm install ...` as a test gate, so a
        # root-only hashFiles SKIPPED this step and the gate died at
        #     bash: line 3: pnpm: command not found   (exit 127)
        # after 49 ginkgo suites had already passed.
        if: hashFiles('package.json', '**/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm/yarn shims for JS test gates)
        # corepack shims npm, pnpm and yarn — and ONLY those. A repo whose
        # packageManager is `bun@…` makes it exit 1 with
        #   Unsupported package manager specification (bun@1.3.9)
        # which reads like a corrupt manifest rather than a tool that was never
        # in corepack's remit; hanzoai/admin died there before running a test.
        # Bun ships its own toolchain, provisioned in the next step.
        if: hashFiles('package.json', '**/package.json') != ''
        run: |
          set -euo pipefail
          pm=$(node -p "require('./package.json').packageManager || ''" 2>/dev/null || echo '')
          case "$pm" in
            bun@*) echo "packageManager is ${pm} — corepack does not shim bun, skipping"; exit 0 ;;
          esac
          corepack enable

      - name: Provision bun (bun test gates)
        # Same guarded provision as the Go, Node and Rust steps: only for callers
        # that declare it, harmless once a runner image bakes bun in. Keyed on the
        # LOCKFILE rather than packageManager because that is what `hashFiles` can
        # see without parsing, and a bun repo always has one.
        if: hashFiles('bun.lock', '**/bun.lock', 'bun.lockb', '**/bun.lockb') != ''
        uses: oven-sh/setup-bun@v2

      - name: Provision Rust toolchain (cargo test gates)
        # Same hole the Go and Node steps close, for the third language this fleet
        # actually ships: hanzoai/cli is Rust, and its gate — `genspec --check`,
        # the one that keeps the CLI's captured command surface from silently
        # drifting from what cloud serves — is a `cargo run`. On a bare
        # runner that is exit 127, so the gate a repo declares would never run:
        # the exact failure this workflow refuses everywhere else.
        # Guarded to Rust callers (Cargo.toml present); a no-op once a runner
        # image bakes rustup in.
        if: hashFiles('Cargo.toml', '**/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Provision Java toolchain (client codegen)
        # openapi-generator is a Java jar, so the `client:` lane below cannot run
        # without a JDK. Guarded on the lane, not on a file: a repo with a
        # `client:` block needs it in every language, and a repo without one
        # never pays for it.
        if: inputs.mode != 'delegate' && hashFiles('hanzo.yml') != ''
        run: |
          set -euo pipefail
          yq -e '.client' hanzo.yml >/dev/null 2>&1 || { echo "no client: lane — skipping JDK"; exit 0; }
          command -v javac >/dev/null 2>&1 && { echo "JDK already present"; exit 0; }
          sudo apt-get update -qq || {
            sudo find /etc/apt -name '*.list' -o -name '*.sources' | \
              xargs -r sudo sed -i 's|https\?://archive.ubuntu.com/ubuntu|http://mirrors.digitalocean.com/ubuntu|g'
            sudo apt-get update -qq
          }
          sudo apt-get install -y -qq openjdk-21-jdk-headless

      - name: Client — regenerate from the release document (per hanzo.yml)
        # THE CLIENT LANE. A generated SDK is a PROJECTION of one document at one
        # version, and this is the only place in the fleet that says how a
        # projection is made. Seven repos in seven languages ran seven copies of
        # these eight lines — three of them (java, kotlin, cpp) as a hand-rolled
        # `codegen-drift-check`, four with nothing at all — which is why four
        # SDKs had no regeneration path and the three that did had never fired.
        #
        # THE COUPLER IS THE DOCUMENT, PASSED BY VALUE AT A PINNED REF. The
        # payload of hanzoai/cloud's `spec-update` carries (version, sha,
        # spec_sha256); this fetches openapi.yaml AT THAT SHA and refuses if the
        # bytes hash to anything else. That refusal is G2 — every projection of
        # one release is generated from the same digest, so "we regenerated
        # python on Tuesday and go on Thursday" cannot happen quietly. Reading
        # api.hanzo.ai instead would be a lie about which deploy this client
        # describes: at fanout time the document is a git object, and the host is
        # whatever it happens to be serving.
        #
        # `.spec-lock` is the receipt, committed beside the generated code: the
        # ref and the digest this tree was generated from. It is what lets anyone
        # — cloud's next release included — ask a client repo "which document are
        # you?" without running a generator.
        #
        # CREDENTIAL: FORGE_TOKEN, contents:read on hanzoai/cloud at git.hanzo.ai.
        # TWO MODES, ONE FETCH, decided by the payload — because there are two
        # questions and they need the same document.
        #
        #   a payload naming a ref  MOVE the projection onto that document, then
        #     commit and cut (last step of this job).
        #   no payload              CHECK that the committed projection is still
        #     what its OWN document (.spec-lock) produces. Writes nothing: a
        #     check that repairs what it measures reports success for a tree that
        #     was wrong when the job started.
        #
        # The check half replaces the hand-rolled `codegen-drift-check` /
        # `spec-drift-check` steps four repos each carried a copy of — and fixes
        # what those copies could not see, because they regenerated from
        # whatever hanzoai/openapi's main happened to be rather than from the
        # document this tree names. A gate whose input moves is a gate two runs
        # of one commit can disagree about.
        if: inputs.mode != 'delegate' && hashFiles('hanzo.yml') != ''
        id: client
        env:
          # ONE HOST, SO ONE CREDENTIAL. The document lives on git.hanzo.ai and
          # FORGE_TOKEN is what reads git.hanzo.ai — the same secret hanzoai/cloud
          # already uses to cut the release tag this lane consumes.
          #
          # What stood here was a fallback chain, SPEC_TOKEN then GH_PAT, and both
          # halves were wrong about which forge holds the document. SPEC_TOKEN is
          # provisioned nowhere, so the lane always fell through; GH_PAT reads
          # github.com, which mirrors hanzoai/cloud 4,968 commits behind and does
          # not carry openapi.yaml at all. The chain therefore resolved to a
          # credential that authenticated fine against a host with no document on
          # it. It has never been safe — only unreached.
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          yq -e '.client' hanzo.yml >/dev/null 2>&1 || { echo "no client: lane"; echo "ran=0" >> "$GITHUB_OUTPUT"; exit 0; }

          SPEC_REPO=$(yq -r '.client.spec.repo // "hanzoai/cloud"' hanzo.yml)
          SPEC_PATH=$(yq -r '.client.spec.path // "openapi.yaml"' hanzo.yml)
          # A MOVE IS A RUN THAT WAS HANDED A REF, and nothing else is. The
          # payload is the only thing that ever names a new document, so it is
          # the only thing that decides. A value, not a place.
          #
          # It used to ask `github.event_name`, and here that question has no
          # answer: git.hanzo.ai reports `workflow_call` to a reusable whatever
          # the caller's event was — measured across 24 repos, where `push`,
          # `schedule` and `workflow_dispatch` all render the same string. So
          # `push` never matched, MODE was `move` on every run in the fleet, and
          # the check half was unreachable. Nine plain pushes regenerated,
          # committed to main and cut a release tag off a document nobody had
          # asked them for.
          #
          # AND IT NO LONGER GOES LOOKING. With no payload it read hanzoai/cloud's
          # newest tag, on the theory that a tag is by construction a document
          # production already serves. v1.801.507 is not on cloud's main and
          # carries no openapi.yaml at all, so the fetch below could only 404 and
          # it took the whole job with it. The pin has ONE owner — the re-pin
          # that opens a patch a person reads — and a second one here is two
          # notions of one document, which is the defect this lane exists to
          # prevent.
          REF=$(printf '%s' "$PAYLOAD" | jq -r '.sha // .version // ""')
          LOCKED=$(sed -n 's/^ref=//p' .spec-lock 2>/dev/null || true)
          if [ -n "$REF" ]; then
            MODE=move
          else
            MODE=check
            REF="$LOCKED"
          fi
          [ -n "$REF" ] || { echo "no payload and no .spec-lock — this tree names no document"; echo "ran=0" >> "$GITHUB_OUTPUT"; exit 0; }
          WANT=$(printf '%s' "$PAYLOAD" | jq -r '.spec_sha256 // ""')
          VERSION=$(printf '%s' "$PAYLOAD" | jq -r '.version // ""')

          [ -n "${FORGE_TOKEN:-}" ] || { echo "::error::the client: lane reads the document from git.hanzo.ai and needs FORGE_TOKEN (contents:read on ${SPEC_REPO}); it is unset"; exit 1; }

          # THE FORGE IS WHERE THE DOCUMENT IS. This lane runs on git.hanzo.ai's
          # own runners against a repo whose canonical home is git.hanzo.ai, and
          # it used to reach across to api.github.com for the bytes — a mirror
          # that trails hanzoai/cloud by thousands of commits and does not serve
          # openapi.yaml at all, so the fetch could only 404. Asking a mirror is
          # not a weaker version of asking the source; it is asking a different
          # question, and one whose answer no release ever produced.
          #
          # The forge serves its API at /v1/, NOT /api/v1/ — /api/v1 returns a 404
          # that reads exactly like a rejected credential. Same route the CLI's
          # Makefile takes, because there is one document at one address.
          curl -fsSL -H "Authorization: token ${FORGE_TOKEN}" \
            "https://git.hanzo.ai/v1/repos/${SPEC_REPO}/raw/${SPEC_PATH}?ref=${REF}" -o "$RUNNER_TEMP/spec"
          GOT=$(sha256sum "$RUNNER_TEMP/spec" | cut -d' ' -f1)

          # G2: one release, one document. A digest that does not match the one
          # the release published means this repo is about to generate against a
          # different document than its siblings — refuse rather than publish a
          # client that describes a version nobody shipped.
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "::error::${SPEC_REPO}@${REF}:${SPEC_PATH} hashes to ${GOT}, but the release published ${WANT}"
            exit 1
          fi

          # THE LOCK ITSELF IS A GATE ON A CHECK: the ref is pinned, so the bytes
          # behind it must be too. A digest that moved under a pinned ref means
          # someone moved a tag, and no amount of regenerating makes that safe.
          if [ "$MODE" = check ]; then
            HAVE=$(sed -n 's/^sha256=//p' .spec-lock)
            [ "$GOT" = "$HAVE" ] || { echo "::error::${SPEC_REPO}@${REF}:${SPEC_PATH} hashes to ${GOT}, but .spec-lock says ${HAVE} — the ref moved under this projection"; exit 1; }
          else
            printf 'ref=%s\nsha256=%s\nrepo=%s\npath=%s\n' \
              "$REF" "$GOT" "$SPEC_REPO" "$SPEC_PATH" > .spec-lock
          fi

          # THE GENERATOR IS HANDED THE DOCUMENT, NOT THE MEANS TO GO FIND ONE.
          # $SPEC is the bytes this step just fetched and digest-checked, so a
          # generator that reads it is generating from the release's document by
          # construction. The scripts used to clone a second repo instead — and
          # four of them cloned one that could not resolve at $SPEC_REF at all —
          # which is how a projection came to describe a document no release
          # published. No credential travels onward: nothing downstream fetches.
          export SPEC="$RUNNER_TEMP/spec" SPEC_REF="$REF" SPEC_SHA256="$GOT" SPEC_VERSION="$VERSION"

          # AND THE DRIVER ARRIVES THE SAME WAY. `generate.py` plus `sdks.yaml`
          # are the one invocation five languages share, and every call site went
          # and got them for itself: python and typescript cloned git.hanzo.ai
          # anonymously, java and kotlin tried github.com through a SPEC_TOKEN /
          # GH_TOKEN / GITHUB_TOKEN / ssh chain, go skipped the driver and read a
          # different file over raw.githubusercontent.com. Five ways to reach one
          # tool, four of them needing a credential the call site does not have.
          #
          # Measured on the first dispatch that ever reached this step (hanzoai/
          # python-sdk, run 44584): `fatal: could not read Username for
          # 'https://git.hanzo.ai'`, exit 128 — an anonymous clone of a private
          # repo, from a job already holding the token that reads it. The lane has
          # the credential, so the lane fetches the tool, once, and hands it over.
          # A call site that no longer clones cannot be wrong about where to.
          #
          # extraheader rather than a token in the URL: a clone URL is echoed by
          # git on failure and lands in the log verbatim.
          export OPENAPI="$RUNNER_TEMP/driver"
          [ -d "$OPENAPI" ] || git -c http.extraheader="Authorization: token ${FORGE_TOKEN}" \
            clone --depth 1 -q https://git.hanzo.ai/hanzoai/openapi "$OPENAPI"

          # AND AN INTERPRETER THAT CAN READ YAML, which is the driver's
          # requirement and not any one language's. The parse toolchain above
          # deliberately provides yq instead of PyYAML — pip is unavailable on
          # locked-down nodes — so `python3 generate.py` finds no `yaml` module
          # and dies on its import line, which is what the first regeneration to
          # get this far actually did. uv carries its own interpreter and its own
          # dependency resolution, needs no root, and is already how every python
          # gate in this fleet runs. Guarded: a no-op where the image bakes it in.
          command -v uv >/dev/null 2>&1 || {
            curl -fsSL https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          }

          gen=$(yq -r '.client.generate // ""' hanzo.yml)
          if [ "$MODE" = check ]; then
            echo "::group::client check ($SPEC_REPO@$REF)"
            # `--check` as an ARGUMENT, not an env var: six of the seven call
            # sites already take it that way, and one spelling of one idea is
            # the point of this lane existing.
            bash -c "$gen --check"
            echo "::endgroup::"
            echo "ran=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$gen" ] && { echo "::group::client generate"; bash -c "$gen"; echo "::endgroup::"; }

          # NO `build:` KEY, and that is the point: the repo has already declared
          # how it proves itself, in `test:`. That block runs BELOW this step and
          # therefore runs over the regenerated tree — compiling the client and
          # its examples, which is exactly G3 (a spec change that produces a
          # client which does not build must block the release). A second
          # declaration here would be the same assertion written twice, free to
          # drift, and only one of the two would gate a plain push.

          echo "ran=1" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "spec_sha256=$GOT" >> "$GITHUB_OUTPUT"
          { git add -A; git diff --cached --quiet && echo "changed=0" || echo "changed=1"; } >> "$GITHUB_OUTPUT"

      - name: Authenticate runner git for private Go modules (test gates)
        # The Test step runs `go vet`/`go test` ON the runner (not in buildx), so
        # `go` fetches private hanzoai/* modules (GOPRIVATE → direct) through the
        # runner's git, which needs a credential. The IMAGE build authenticates
        # via the KMS `gh_token` inside buildx (GIT_TOKEN); the earlier GH_PAT
        # git-auth step is a no-op for repos that rely on that KMS token (GH_PAT
        # unset) — so `go vet` dies with `could not read Username for github.com`.
        # Reuse the SAME token here for the runner's git (GIT_TOKEN, set by the
        # KMS step above; GH_PAT fallback). No-op when neither is present.
        #
        # AND OUR OWN MODULES RESOLVE FROM OUR OWN FORGE. A module path is a NAME,
        # not an address: `github.com/<owner>/x` is what the package is called, and
        # which host git dials for it is a separate decision. On a forge runner
        # that decision is the forge — the forge is where the code canonically
        # lives, and github.com is fed by a mirror that trails it, sometimes by
        # hours and sometimes not at all.
        #
        # Measured, on the first run in which this step's gate had ever actually
        # executed: hanzoai/cloud's go.mod carries `github.com/hanzoai/dashscopego
        # v0.6.0` as an indirect dependency. git.hanzo.ai serves it; github.com
        # answers `Repository not found`. So `go vet` died before a single test
        # ran, on a module that was never missing. Its own caller already knew the
        # answer — cloud's `containment` and `reach` jobs each make this exact
        # substitution, with a comment about the nine consecutive releases an
        # ACL drift on ONE sibling module once blocked — but the gate that runs
        # its tests reached the modules through a different door.
        #
        # go.sum is what makes this safe rather than merely convenient: the forge
        # serves the same objects, so the fetched zip hashes to the h1: line
        # already committed. A forge serving different bytes fails the build
        # loudly instead of shipping them.
        #
        # Longest prefix wins in git, so the owner-scoped forge rule outranks the
        # bare github.com rule beneath it and every OTHER module still resolves
        # from github.com. Both rules are optional and independent: no FORGE_TOKEN
        # (or a github.com-hosted run, where the server IS github.com) leaves the
        # old behaviour exactly as it was.
        #
        # SPLIT THE SERVER, do not strip a scheme you assumed. GITHUB_SERVER_URL
        # on this fleet's runners is `http://hanzo-git.hanzo.svc` — the forge's
        # in-cluster address, plain http — and a `${SERVER#https://}` that only
        # knows the https spelling passes it through whole, producing
        # `https://http://hanzo-git.hanzo.svc/...` and a git that resolves the host
        # `http`. Take the scheme and the host as the two values they are, and
        # compare the HOST against github.com so the guard cannot be fooled by a
        # spelling either.
        if: steps.gomod.outputs.file != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          CFG="$RUNNER_TEMP/gitconfig-go-test"; : > "$CFG"
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          SCHEME="${SERVER%%://*}"; HOST="${SERVER#*://}"; HOST="${HOST%/}"
          wrote=0

          if [ -n "${FORGE_TOKEN:-}" ] && [ "$HOST" != "github.com" ]; then
            GIT_CONFIG_GLOBAL="$CFG" git config --global \
              url."${SCHEME}://x:${FORGE_TOKEN}@${HOST}/${OWNER}/".insteadOf \
              "https://github.com/${OWNER}/"
            echo "${OWNER}/* modules resolve from ${SCHEME}://${HOST}"
            wrote=1
          fi

          TOKEN="${GIT_TOKEN:-${GH_PAT:-}}"
          if [ -n "$TOKEN" ]; then
            GIT_CONFIG_GLOBAL="$CFG" git config --global \
              url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "github.com modules authenticated"
            wrote=1
          fi

          [ "$wrote" = 1 ] || { echo "no git credential — public modules only"; exit 0; }
          { echo "GIT_CONFIG_GLOBAL=$CFG"; echo "GIT_CONFIG_NOSYSTEM=1"; } >> "$GITHUB_ENV"
          echo "runner git authenticated for private Go modules"

      - name: Test (per hanzo.yml)
        # Every gate runs here, and every gate is then asked ONE question: did it
        # actually run a test?
        #
        # A green build over ZERO tests is the worst failure mode a gate has,
        # because it is indistinguishable from a healthy one. Two ways to reach it
        # are live in this fleet right now, both silent, both exit 0:
        #   - `go test ./...` where nothing has a _test.go  → `[no test files]`
        #   - a build tag that excludes the suite (hanzoai/gateway shipped
        #     `//go:build legacy` tests and a target that passed no -tags; hanzoai/iam
        #     runs `-tags skipCi` against files guarded `//go:build !skipCi`)
        #                                                   → `[no tests to run]`
        # Per-repo vigilance is not a mechanism, so the assertion lives HERE, once,
        # and every caller inherits it the moment it re-imports this workflow.
        #
        # The rule is the runners' OWN words, not a heuristic: fail when a gate SAYS
        # it ran nothing AND nothing shows as having run. A gate that is not a test
        # gate — vet, lint, a build, a codegen-freshness check — says neither and is
        # untouched. To silence it legitimately, make the gate run a test.
        if: inputs.tests != 'false'
        run: |
          set -euo pipefail
          NOTHING='\[no test files\]|\[no tests to run\]|no tests ran|collected 0 items|No tests found|no test specified|running 0 tests|Tests:[[:space:]]+0 total|(^|[^0-9])0 (passing|passed)'
          SOMETHING='^[[:space:]]*--- (PASS|FAIL|SKIP):|^(ok|FAIL)[[:space:]]+[^[:space:]]+[[:space:]]+([0-9.]+s|\(cached\))([[:space:]]+coverage)?$|[1-9][0-9]* (passed|failed|passing|failing)|test result: (ok|FAILED)\.[[:space:]]+[1-9]|Tests:[[:space:]]+[1-9]'
          log="${RUNNER_TEMP:-/tmp}/test-gate.log"
          # ONE read of the gate list, asked two questions. The loop below fails a
          # gate that SAYS it ran nothing; it cannot ask a repo that declares no
          # gate at all, because then the loop does not run and the build goes
          # green having tested nothing — the very shape this step exists to end.
          # 23 repos in the fleet are in that state today, so failing here would
          # paint the fleet red without fixing one of them. Say it instead, in the
          # summary this build already writes, so the absence is a fact ON THE RUN
          # rather than something only a reader of hanzo.yml would ever notice.
          gates="$(yq -o=json -I=0 '.test // []' hanzo.yml)"
          if [ "$(printf '%s' "$gates" | jq 'length')" = 0 ]; then
            echo "::warning::hanzo.yml declares no \`test:\` gate — this build was NOT tested"
            echo "**Not tested** — \`hanzo.yml\` declares no \`test:\` gate." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          printf '%s' "$gates" | jq -c '.[]' | while read -r t; do
            name=$(echo "$t"|jq -r .name); cmd=$(echo "$t"|jq -r .run)
            echo "::group::test $name"; bash -c "$cmd" 2>&1 | tee "$log"; echo "::endgroup::"
            if grep -Eq "$NOTHING" "$log" && ! grep -Eq "$SOMETHING" "$log"; then
              echo "::error::test gate '$name' reported success without running a single test"
              grep -Eho "$NOTHING" "$log" | sort -u | sed 's/^/  ran nothing: /'
              exit 1
            fi
          done

      - name: Delegate build to platform (mode=delegate)
        # Delegate moves WHERE the image is built. It does not move whether the
        # commit was gated — so this step sits AFTER `Test (per hanzo.yml)`, and
        # every step the gate needs runs in both modes. It used to sit fourth,
        # before any of them, and `mode: delegate` therefore skipped the gate
        # along with the build: 20 steps skipped, 0 executed, green. "ci gates,
        # platform builds" was the design and the ordering said otherwise.
        #
        # What it does: POST each image in hanzo.yml to platform.hanzo.ai's
        # direct-enqueue webhook (`/v1/runner`). Platform creates a build_job
        # row, launches an in-cluster BuildKit Job on its own pool, pushes to the
        # registry, and — for a system service — patches the operator Service CR
        # to roll it. Downstream is IDENTICAL to the platform webhook path, so a
        # delegated build behaves exactly like a platform-native one. What this
        # job skips is buildx, publish and deploy — not the gate.
        if: inputs.mode == 'delegate'
        env:
          ENQUEUE_URL: ${{ vars.PLATFORM_ENQUEUE_URL || 'https://platform.hanzo.ai/v1/runner' }}
          ENQUEUE_TOKEN: ${{ secrets.PLATFORM_BUILD_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ENQUEUE_TOKEN:-}" ]; then
            echo "::error::mode=delegate needs the PLATFORM_BUILD_CALLBACK_TOKEN secret (secrets: inherit)"; exit 1
          fi
          # `/v1/runner` has no way to carry a build_secret: its wire body accepts
          # buildArgs, and platform resolves NO KMS name — its own secrets arrive
          # as a KMSSecret CRD with a statically declared key list, which cannot
          # serve a name discovered by reading a hanzo.yml at some SHA. A repo
          # that declares build_secrets and delegates gets an image built without
          # them: green run, empty credential, exactly the silence the KMS step
          # refuses. Say so here rather than downstream, where this run shows no
          # logs at all.
          if [ -n "$(yq -r '[(.images // [])[] | (.build_secrets // [])[]] | unique | .[]' hanzo.yml 2>/dev/null || true)" ]; then
            echo "::error::hanzo.yml declares build_secrets, which mode=delegate cannot deliver — platform builds with no KMS. Build on the runner (drop mode: delegate), or drop the build_secrets."; exit 1
          fi
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT=$(echo "$SHA" | cut -c1-7)
          REF="${{ github.ref }}"
          BRANCH="${{ github.ref_name }}"
          # One enqueue per (image, platform), mirroring the buildx tag shape the
          # deploy path expects (`sha-<short>-<arch>[-<suffix>]`). Default arch is
          # amd64 (single-arch), so an existing repo's tag shape is unchanged.
          yq -o=json -I=0 '.images' hanzo.yml | jq -c '.[]' | while read -r img; do
            name=$(echo "$img"|jq -r .name); repo=$(echo "$img"|jq -r .repo)
            ctx=$(echo "$img"|jq -r .context); df=$(echo "$img"|jq -r '.dockerfile // (.context+"/Dockerfile")')
            sfx=$(echo "$img"|jq -r '."tag-suffix" // ""')
            # Same Go-builder check the buildx lane runs. It belongs here too:
            # delegating the build moves WHERE it runs, not whether the image
            # can compile the module, and a mismatch enqueued to platform fails
            # on a machine whose logs this run never shows. Cheap to check on
            # the runner that already has the checkout; expensive to discover
            # from the in-cluster builder.
            "$CI_HOME/bin/gover" "$df" "$ctx"
            echo "$img" | jq -r '(.platforms // ["linux/amd64"])[]' | while read -r plat; do
              arch="${plat##*/}"
              image="${repo}:sha-${SHORT}-${arch}${sfx:+-$sfx}"
              body=$(jq -nc \
                --arg repo "$REPO" --arg sha "$SHA" --arg image "$image" \
                --arg ref "$REF" --arg branch "$BRANCH" \
                --arg dockerfile "$df" --arg context "$ctx" --arg arch "$arch" \
                '{repo:$repo,sha:$sha,image:$image,ref:$ref,branch:$branch,dockerfile:$dockerfile,context:$context,os:"linux",arch:$arch}')
              echo "::group::delegate $name → $image"
              code=$(curl -sS -o /tmp/enqueue.out -w '%{http_code}' -X POST "$ENQUEUE_URL" \
                -H "Authorization: Bearer $ENQUEUE_TOKEN" -H 'Content-Type: application/json' -d "$body")
              cat /tmp/enqueue.out; echo
              # 202 Accepted = queued; 409 = no live runner for the pool (surface it loud).
              if [ "$code" != "202" ]; then echo "::error::enqueue $image failed (HTTP $code)"; exit 1; fi
              echo "::endgroup::"
            done
          done

      - name: Build & push images (per hanzo.yml)
        # AFTER the gate, deliberately. This step used to run before `test:`,
        # so a repo whose gates FAILED still published an image: hanzoai/base
        # f9ec7067 pushed sha-f9ec706-amd64 on a run whose tests then went red.
        # Deploy and Publish site were skipped, so nothing shipped it — but the
        # tag existed, and a tag that exists is something a human pins by hand.
        # An artifact is a claim that the commit passed; it should not be
        # possible to produce one from a commit that did not.
        #
        # Nothing here needs the toolchains above it, and Deploy still follows
        # this step, so the only thing the move changes is that a red gate now
        # produces no image at all.
        if: inputs.mode != 'delegate'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Test-only callers (hanzo.yml without `images:` — e.g. a repo whose
          # image lane lives in its own release.yml, or a pure library) skip the
          # build step entirely instead of exploding on a null .images.
          if [ "$(yq -r '.images // [] | length' hanzo.yml 2>/dev/null || echo 0)" = "0" ]; then
            echo "::notice::no images: in hanzo.yml — test-only caller, skipping build"; exit 0
          fi
          # Build-time private cross-org Go module read (the buildx `gh_token`
          # secret): prefer the KMS-fetched GIT_TOKEN, else fall back to the org
          # GH_PAT — the SAME BuildKit gh_token cloud's release.yml uses (proven
          # working). Keeps image builds green when the KMS deploy-cred fetch is
          # unavailable (a repo with a private cross-org dep like hanzoai/cloud
          # otherwise fails `go mod tidy` with git exit 128 in the buildx stage).
          # No-op for public-only builds when both are empty. Exported so the
          # `--secret id=gh_token,env=GIT_TOKEN` below reads it from the env.
          export GIT_TOKEN="${GIT_TOKEN:-${GH_PAT:-}}"
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IS_TAG=$([ "${{ github.ref_type }}" = "tag" ] && echo 1 || echo 0)
          REL="${{ github.ref_name }}"   # the git tag, verbatim: v1.26.19
          VER="${REL#v}"                 # v-stripped alias: 1.26.19
          yq -o=json -I=0 '.images' hanzo.yml | jq -c '.[]' | while read -r img; do
            name=$(echo "$img"|jq -r .name); ctx=$(echo "$img"|jq -r .context)
            df=$(echo "$img"|jq -r '.dockerfile // (.context+"/Dockerfile")'); repo=$(echo "$img"|jq -r .repo)
            # tag-suffix is OPTIONAL (most repos ship a single variant). When set
            # (e.g. "ce"/"ee") it qualifies every tag; when absent the tags are
            # clean (no trailing dash). Build + deploy must agree on this shape.
            sfx=$(echo "$img"|jq -r '."tag-suffix" // ""')
            # platforms is OPT-IN per image in hanzo.yml (default: amd64 only, so
            # every existing repo's tag shape "-amd64" is UNCHANGED). Set e.g.
            #   platforms: [linux/amd64, linux/arm64]
            # to emit a multi-arch MANIFEST LIST — one digest serving both arches.
            # DOKS has no arm64 nodes, so arm64 builds via buildx QEMU emulation
            # (binfmt set up below); pure-Go (CGO_ENABLED=0) Dockerfiles that honor
            # $TARGETARCH cross-compile natively (fast, no emulation). For true
            # native-speed arm64, register a bare-metal arm64 host (spark/GB10) as
            # the hanzo-build-linux-arm64 self-hosted runner (values-build-arm64.yaml).
            plats=$(echo "$img"|jq -r '(.platforms // ["linux/amd64"]) | join(",")')
            # ---- Refuse a Go builder older than the module it compiles -------
            # The official golang images set GOTOOLCHAIN=local, so a go.mod
            # requiring a newer Go than the base image does not degrade — it
            # dies mid-build with "go.mod requires go >= X (running Y;
            # GOTOOLCHAIN=local)". hanzoai/visor v1.108.16 is the shipped
            # instance, and it is invisible before the image build: every local
            # `go build` succeeds because a dev box runs GOTOOLCHAIN=auto and
            # just downloads what the module asks for. So the break is
            # introduced by editing go.mod — a file with nothing to do with
            # Docker — and found by a red release build.
            #
            # It is not one repo's problem either: a sweep of every Dockerfile
            # across the orgs found 54 below their own go.mod in 23 repos, and
            # only 7 of 223 Go builder stages set GOTOOLCHAIN=auto. Fixing those
            # fixes today; this line is what makes the 55th impossible.
            #
            # Checked here, before any build work, so the run fails in seconds
            # rather than after binfmt, a version derivation and a layer cache.
            "$CI_HOME/bin/gover" "$df" "$ctx"
            # ---- The semver this build publishes ----------------------------
            # A branch build used to publish sha-<short7> and nothing else, so an
            # image only earned a version when a human remembered to cut a git
            # tag. That is the whole reason 14 of the fleet's 117 pins named a
            # commit instead of a release: not drift, just the only tag CI ever
            # offered them. Every build now publishes a version too, and the
            # sha- tag stays beside it for forensics.
            #
            # The number is DERIVED, never typed, by bin/imgver — the ONE
            # implementation, shared with the hand-rolled
            # .hanzo/workflows/deploy.yml that 11 repos carry instead of importing
            # this workflow (see .github/actions/imgver). Written twice it would be
            # right twice and then wrong once, which is exactly how `sha-<short>`
            # became the only tag those repos ever published. Read that script for
            # the rule; it is monotonic against the repo's manifest AND the
            # registry, so one tag can never cover two digests.
            ver=""
            if [ "$IS_TAG" = 1 ]; then
              # Release build: the git tag IS the version. Identity in, identity
              # out — deriving here would publish a number nobody asked for.
              :
            else
              # An explicit `version:` on the image entry wins over the repo-wide
              # one; both are optional, and imgver falls back to the manifest.
              iv=$(echo "$img"|jq -r '.version // ""')
              [ -z "$iv" ] && iv=$(yq -r '.version // ""' hanzo.yml)
              ver=$(IMGVER_VERSION="$iv" "$CI_HOME/bin/imgver" "$repo" "$ctx")
            fi
            # NO `latest`. Every build published it, branch and release alike,
            # against a fleet rule that says a deployable tag is a semver or a
            # sha and nothing else. It is the one tag that cannot answer "which
            # build is this" — it names whatever finished most recently, so two
            # digests wear it within a day and a pull is a race rather than a
            # choice. Measured before removing: ZERO pins on it anywhere —
            # charts, manifests, and all live workloads across every cluster.
            # It was published for no reader.
            #
            # What every build still gets: an immutable `sha-<short7>` for
            # forensics and a semver for pinning. Those two are the whole
            # contract, and both are already below.
            if [ "$plats" = "linux/amd64" ]; then
              # single-arch: keep the exact legacy tag shape (-amd64) deploys expect.
              TAGS="-t $repo:sha-${SHORT}-amd64${sfx:+-$sfx}"
            else
              # multi-arch: one arch-neutral manifest-list tag (no -amd64 suffix).
              docker run --privileged --rm tonistiigi/binfmt --install arm64 >/dev/null 2>&1 || true
              TAGS="-t $repo:sha-${SHORT}${sfx:+-$sfx}"
            fi
            # Release (tag) build. The git tag IS the release name, so publish it
            # VERBATIM (v1.26.19) — that is the shape a universe CR pins, and
            # stripping the v is why releases were finished by hand-`crane copy`ing
            # sha-<sha7> onto the semver a human typed. Identity in, identity out.
            # The v-stripped alias stays for CRs already pinned that way (world
            # 2.4.51), and is skipped when a repo tags without a v. The old
            # `<ver>-amd64` alias is deleted: no CR in the fleet pinned it.
            if [ "$IS_TAG" = 1 ]; then
              TAGS="$TAGS -t $repo:${REL}${sfx:+-$sfx}"
              [ "$REL" != "$VER" ] && TAGS="$TAGS -t $repo:${VER}${sfx:+-$sfx}"
            else
              # The tag universe is meant to PIN. It goes on every build, not
              # only the ones somebody remembered to tag by hand.
              TAGS="$TAGS -t $repo:${ver}${sfx:+-$sfx}"
            fi
            echo "::group::build $name → $repo (${sfx}) [$plats]"
            # --build-arg assembly: static hanzo.yml `args` (a fixed value, e.g. a
            # pinned base image tag) + `build_secrets` (KMS values the KMS step
            # exported into the env above). Empty when a repo declares neither, so
            # the buildx line is unchanged for every existing repo.
            BUILD_ARGS=""
            while IFS= read -r kv; do [ -n "$kv" ] && BUILD_ARGS="$BUILD_ARGS --build-arg $kv"; done \
              < <(echo "$img" | jq -r '(.args // {}) | to_entries[] | "\(.key)=\(.value)"')
            for bs in $(echo "$img" | jq -r '(.build_secrets // [])[]'); do
              v=$(printenv "$bs" 2>/dev/null || true)
              # Defense in depth: the KMS step above already refuses to continue
              # with an unresolved build_secret, so reaching here empty means the
              # two steps disagree. Stop rather than bake a blank credential.
              [ -z "$v" ] && { echo "::error::build_secret $bs is unset at build time — refusing to bake an empty value"; exit 1; }
              BUILD_ARGS="$BUILD_ARGS --build-arg $bs=$v"
            done
            # PROVENANCE: which commit are these bytes. Passed BOTH ways on
            # purpose. The --label sets it from outside for any Dockerfile; the
            # --build-arg feeds `ARG REVISION` for the Dockerfiles that stamp the
            # label themselves (hanzoai/cloud declares `ARG REVISION=unknown`,
            # and `unknown` is exactly what every image built without this said).
            #
            # An unlabelled image cannot be traced to source, and that stops being
            # cosmetic the moment two builders race for one tag: with one image
            # labelled and the other reading `unknown`, "which of these is the
            # release" had no answer short of diffing layers — while the wrong one
            # was already pinned. A version is a receipt only if the image can
            # name its own commit, so every image this fleet publishes now can.
            #
            # A Dockerfile with no `ARG REVISION` ignores the build-arg (buildkit
            # warns, never fails), so this is a no-op for every repo that has not
            # asked for it.
            PROV="--build-arg REVISION=$GITHUB_SHA"
            PROV="$PROV --label org.opencontainers.image.revision=$GITHUB_SHA"
            PROV="$PROV --label org.opencontainers.image.version=${ver:-$REL}"
            PROV="$PROV --label org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            # GIT_TOKEN (from KMS, via GITHUB_ENV) is passed as the `gh_token`
            # BuildKit secret so Dockerfiles can clone private Go modules; omitted
            # cleanly when absent (public-only builds unaffected).
            docker buildx build --platform "$plats" $BUILD_ARGS $PROV ${GIT_TOKEN:+--secret id=gh_token,env=GIT_TOKEN} --push $TAGS -f "$df" "$ctx"
            # The semver is the tag the fleet PINS, so prove it exists before the
            # run goes green — buildx can exit 0 while the manifest is not yet
            # resolvable, and a pin onto a phantom tag is an ImagePullBackOff.
            # The digest is printed with it because universe pins repo:tag@digest
            # and the kubelet honours the DIGEST: publishing both here is what
            # lets the two move together instead of being looked up separately
            # and drifting apart.
            pin="$repo:${ver:-$REL}${sfx:+-$sfx}"
            for i in 1 2 3 4 5 6; do
              dig=$(docker buildx imagetools inspect "$pin" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
              [ -n "$dig" ] && break
              sleep 5
            done
            [ -n "$dig" ] || { echo "::error::$pin not resolvable after push"; exit 1; }
            echo "| \`$pin\` | \`$dig\` |" >> "$RUNNER_TEMP/pins.md"
            # Dual-host: mirror the exact tag set to oci.hanzo.ai (server-
            # side manifest copy — no rebuild). ghcr.io/<org>/<name> →
            # oci.hanzo.ai/<org>/<name>; public consumers keep ghcr, the fleet
            # is migrating to pull from ours.
            #
            # A copy that does not land FAILS THE RUN. It used to print
            # `::warning::` from a `while read` on the end of a pipeline — a
            # child shell, where neither `set -e` nor an `exit` reaches the
            # step — so a failed copy and a successful one produced the same
            # green run and the same unread line. 73 of the fleet's 102
            # first-party images were published to ghcr and never reached
            # oci.hanzo.ai at all, every one of them under a green run. A
            # mirror nobody is told about is a mirror nobody fills.
            if [ "${MIRROR_OK:-}" = "1" ]; then
              # crane, not buildx imagetools: the IAM token realm doesn't answer
              # buildx's multi-scope token request (spec gap, tracked).
              command -v crane >/dev/null 2>&1 || {
                mkdir -p "$HOME/.local/bin"
                curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
                  | tar -xz -C "$HOME/.local/bin" crane
                export PATH="$HOME/.local/bin:$PATH"
              }
              # ONE mapping, stated once. The GHCR org and the registry org are
              # not the same word — ghcr.io/hanzoai/x mirrors to
              # oci.hanzo.ai/hanzo/x — and a second copy of this table is
              # how a push path and a pin drift into naming different images.
              rorg="${repo#*/}"; rname="${rorg#*/}"; rorg="${rorg%%/*}"
              case "$rorg" in
                hanzoai) rorg=hanzo ;;
                zooai)   rorg=zoo ;;
                *)       ;;   # bootnode, lux-private, ... map to themselves
              esac
              mrepo="oci.hanzo.ai/$rorg/$rname"
              # The tag set as an ARRAY, walked in THIS shell: a herestring is a
              # redirect, not a pipeline, so `set -e` and `exit` still belong to
              # the step. TAGS is the same `-t <ref>` list handed to buildx, so
              # what is mirrored is by construction what was pushed.
              read -ra tagv <<<"$TAGS"
              for ref in "${tagv[@]}"; do
                [ "$ref" = "-t" ] && continue
                dst="$mrepo:${ref##*:}"
                # The digest the SOURCE serves, read before the copy. Refuse an
                # empty one: `[ "$a" = "$b" ]` on two blanks is true, and a
                # comparison that cannot fail is the bug being fixed here.
                want=$(crane digest "$ref")
                [ -n "$want" ] || { echo "::error::cannot read the digest of $ref"; exit 1; }
                crane copy "$ref" "$dst"
                # Read the DESTINATION back. `crane copy` exiting 0 is the
                # copier's account of a write; the digest the registry answers
                # with is the fact, and the two disagree whenever a copy is
                # partial or the tag already names other bytes. Same shape as
                # the `helm show chart` re-read charts.yml does after a push.
                got=""
                for i in 1 2 3 4 5 6; do
                  got=$(crane digest "${dst}-mutant" 2>/dev/null || true)
                  [ "$got" = "$want" ] && break
                  sleep 5
                done
                [ "$got" = "$want" ] \
                  || { echo "::error::$dst serves ${got:-nothing}, not $want — the copy did not land"; exit 1; }
                echo "mirrored $ref -> $dst @ $want"
              done
            fi
            echo "::endgroup::"
          done
          # The pins this run earned, ready to paste into universe. Tag and
          # digest are printed TOGETHER because they are one fact: the failure
          # this prevents is a new tag landing beside an old digest, which
          # reports the new version on the pod and serves the old bytes.
          if [ -s "$RUNNER_TEMP/pins.md" ]; then
            { echo "### Pins"; echo; echo "| image | digest |"; echo "|---|---|";
              cat "$RUNNER_TEMP/pins.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Client — commit the projection and cut the patch
        # LAST, and after `test:` on purpose: this pushes a tag, the tag starts a
        # publish, and a published client is the one artifact in this workflow
        # nobody can take back. Everything that could refuse it has already run.
        #
        # A generated client is not authored code, so there is nothing left for a
        # human to review that the gates above have not asked: it regenerated
        # from a digest the release published, and the repo's own `test:` block
        # compiled it and its examples over exactly these bytes. Holding that
        # behind a pull request is what produced the state this lane replaces —
        # js-sdk's regeneration fired twice ever, both red; go-sdk's and
        # rust-sdk's never ran at all.
        #
        # PATCH ONLY, and derived rather than typed: read the current version,
        # add one to its last component. A projection never earns a minor or a
        # major — the document decides the surface and this repo only restates it.
        # (npm `hanzoai` going 0.0.1-alpha.1 -> 2.0.5 is what a hand-typed version
        # does.) The repo's OWN tag lane publishes to its registry; this only
        # mints the tag that starts it, so the publish credential stays where the
        # publish is.
        if: inputs.mode != 'delegate' && steps.client.outputs.ran == '1' && steps.client.outputs.changed == '1' && github.event_name != 'pull_request'
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name hanzo-dev; git config user.email dev@hanzo.ai

          # ONE key, `version:`, saying WHERE this client's version lives —
          # because that answer is genuinely different per language and pretending
          # otherwise means inventing a second place a version can be wrong.
          #
          #   "<file>:<command printing it>"  it lives in a file; rewrite and tag
          #   tag                             the tag IS the version (a Go module
          #                                   has nothing to rewrite)
          #   absent                          CI cannot derive one — commit the
          #                                   projection, cut nothing, say so
          #
          # The third state is not a gap to fill later. A repo whose version is
          # not x.y.z (a `-alpha.N` gradle build) has no patch for this lane to
          # derive, and guessing one would tag bytes under a number nobody chose.
          # Its projection still lands and is still gated; only the cut waits.
          bump=$(yq -r '.client.version // ""' hanzo.yml)
          SPEC_REPO=$(sed -n 's/^repo=//p' .spec-lock)
          SPEC_REF=$(sed -n 's/^ref=//p' .spec-lock)
          MSG="client: regenerate from ${SPEC_REPO}@${SPEC_REF}"
          FILE=""; READ=""
          case "$bump" in
            "")   CUR="" ;;
            tag)  git fetch --quiet --tags origin
                  CUR=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
                  [ -n "$CUR" ] || { echo "::error::client version: tag, but no vX.Y.Z tag exists to succeed"; exit 1; } ;;
            *)    FILE=${bump%%:*}; READ=${bump#*:}; CUR=$(bash -c "$READ") ;;
          esac

          NEXT=""
          if [ -n "$CUR" ]; then
            case "$CUR" in
              *.*.*[!0-9.]*|*[!0-9.]*) echo "::error::client version '$CUR' is not x.y.z — declare a version: this lane can derive a patch from, or drop the key and cut by hand"; exit 1 ;;
            esac
            NEXT="${CUR%.*}.$(( ${CUR##*.} + 1 ))"
            MSG="$MSG (${NEXT})"
            if [ -n "$FILE" ]; then
              # Rewrite in place, then prove it moved. A sed that matched nothing
              # is a tag that names the previous release's bytes.
              sed -i "0,/${CUR//./\\.}/s//${NEXT}/" "$FILE"
              NOW=$(bash -c "$READ")
              [ "$NOW" = "$NEXT" ] || { echo "::error::version bump did not take in $FILE ($CUR -> $NOW, wanted $NEXT)"; exit 1; }
            fi
          fi

          git add -A
          git commit -q -m "$MSG"
          # THE PROJECTION GOES BACK WHERE IT CAME FROM. This pushed to
          # github.com, and the whole job had checked out from, generated
          # against and pinned itself to git.hanzo.ai — so the last act of a
          # successful regeneration was to offer the result to a host that had
          # never seen the parent commit. Measured on hanzoai/python-sdk, whose
          # client lane and full test gate had just gone green: `fatal: did not
          # receive expected object`, then `[rejected] HEAD -> main (fetch
          # first)` and `[remote rejected] v3.2.3`. The regeneration was correct
          # and landed nowhere, which is indistinguishable from never running.
          #
          # GITHUB_SERVER_URL is the host this run belongs to — the forge's
          # in-cluster address on a forge runner — so the push is addressed the
          # same way the checkout was, and FORGE_TOKEN is the credential that
          # host takes. The tag lands where the publish workflow that watches
          # for it also lives.
          [ -n "${FORGE_TOKEN:-}" ] || { echo "::error::the cut pushes the projection back to git.hanzo.ai and needs FORGE_TOKEN (contents:write)"; exit 1; }
          REMOTE="${GITHUB_SERVER_URL:-https://git.hanzo.ai}"
          REMOTE="${REMOTE%/}/${{ github.repository }}"
          # CLEAR WHAT CHECKOUT WROTE FIRST. `http.extraHeader` is MULTI-VALUED
          # and url-matching does not displace a less specific entry: git sends
          # EVERY matching header, and the server honours the first
          # `Authorization` it reads. actions/checkout writes one for the host
          # it cloned from, so setting ours merely put a second credential on
          # the wire — the actions token won, and the last step of a successful
          # regeneration died on `User -2 is not allowed to push to protected
          # branch main` while the credential that IS allowed sat unused in the
          # environment. Measured on hanzoai/java-sdk runs 20 and 21, whose
          # client lane and both test gates had gone green; and on the wire:
          #
          #   git -c http.<host>/.extraheader='AUTHORIZATION: basic A' \
          #       -c http.<host>/o/r.extraheader='Authorization: token F' ls-remote …
          #     -> the request carries BOTH.
          #
          # One credential travels, which is the only shape that can be right.
          # Safe to unset here because this is the last step of the job, and
          # checkout's own post-step only unsets what it still finds.
          git config --local --name-only --get-regexp '^http\..*extraheader$' 2>/dev/null \
            | while read -r k; do git config --local --unset-all "$k"; done
          git config --local http.extraheader "Authorization: token ${FORGE_TOKEN}"
          # The branch this run is on. act_runner leaves ref_name empty on an
          # ordinary push, and `HEAD:` with nothing after the colon is not a
          # refspec, so the default is spelled out rather than assumed.
          BRANCH="${GITHUB_REF_NAME:-}"; [ -n "$BRANCH" ] || BRANCH=main
          if [ -n "$NEXT" ]; then
            git tag "v${NEXT}"
            git push "$REMOTE" "HEAD:$BRANCH" "refs/tags/v${NEXT}"
            echo "cut v${NEXT} — the repo's tag lane publishes it"
            echo "### client v${NEXT} from ${SPEC_REPO}@${SPEC_REF}" >> "$GITHUB_STEP_SUMMARY"
          else
            git push "$REMOTE" "HEAD:$BRANCH"
            echo "::warning::projection committed but NOT cut — hanzo.yml declares no client.version:, so this repo publishes when a human tags it"
            echo "### projection from ${SPEC_REPO}@${SPEC_REF} — not cut (no client.version:)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build & publish binaries (per hanzo.yml)
        # The plugin lane. `images:` ships an OCI image a CLUSTER runs;
        # `binaries:` ships an EXECUTABLE a RUNNING HOST installs — a zip plugin
        # (`zip.Load(zip.Plugin{URL, Sum})`), which fetches the artifact,
        # verifies its SHA-256 BEFORE making it executable, and caches it by
        # digest. So a plugin is built ONCE per OS/arch and every host picks up
        # the same bits: nobody rebuilds the world to ship a plugin, and no host
        # is trusted to have built it right.
        #
        # It rides THIS pipeline, not a second one — same hanzo.yml, same job,
        # same runner, same KMS token — and adds two rules of its own:
        #   - BUILT on every push, PUBLISHED only on a tag. A cross-compile that
        #     breaks arm64 fails the PR that broke it, not the release.
        #   - published AFTER the bits are GATED, because a host installs an
        #     artifact unattended. Normally that gate is the `test:` step above,
        #     in this same run. A caller passing `tests: false` asserts it ran
        #     EARLIER on this exact commit: hanzoai/cloud mints its v* tag only
        #     after that SHA passed the gate on main and built and smoked
        #     (clients/platform/release.go), so the tag build would re-test a
        #     commit already proven. The invariant did not weaken — it is
        #     enforced once instead of twice, and the assertion is the input.
        #     (Images push before tests; an image is rolled out by a deliberate,
        #     reviewed pin — an artifact is not.)
        # dist/binaries.json is uploaded with them: url + sha256 for every
        # artifact, so the bits and the digest that authorizes them are the same
        # release, and a host reads url+sum from ONE place.
        if: inputs.mode != 'delegate'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_AUTOMATIC: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(yq -r '.binaries // [] | length' hanzo.yml 2>/dev/null || echo 0)" = "0" ]; then
            echo "::notice::no binaries: in hanzo.yml — nothing to publish"; exit 0
          fi
          TAG="${{ github.ref_name }}"; REPO="${{ github.repository }}"
          IS_TAG=$([ "${{ github.ref_type }}" = "tag" ] && echo 1 || echo 0)
          # The runner tells us which forge it is talking to — github.com on the
          # GitHub side, a GHES/forge front door elsewhere. Reading it instead of
          # hardcoding the hostname is what keeps ONE lane serving both.
          SERVER="${GITHUB_SERVER_URL:-https://github.com}"
          API="${GITHUB_API_URL:-https://api.github.com}"
          case "$API" in
            https://api.github.com) UPLOADS=https://uploads.github.com ;;
            *) UPLOADS="$SERVER/api/uploads" ;;
          esac
          # A repo naming a bucket: publishes to hanzoai/s3 instead of a release.
          # Same artifacts, same index, one url per artifact — only where it
          # points changes, and it is decided HERE because the url is baked into
          # binaries.json at build time.
          BUCKET="$(yq -r '.bucket // ""' hanzo.yml 2>/dev/null || true)"
          if [ -n "$BUCKET" ]; then
            # Host and scheme are the two clients/s3admin reads, so CI publishes
            # to the same URL the services resolve.
            SCHEME=https
            if [ "${S3_PUBLIC_SECURE:-true}" = "false" ]; then SCHEME=http; fi
            BASE="$SCHEME://${S3_PUBLIC_ENDPOINT:-s3.hanzo.ai}/$BUCKET/$REPO/$TAG"
          else
            BASE="$SERVER/$REPO/releases/download/$TAG"
          fi
          rm -rf dist; mkdir -p dist
          # CGO_ENABLED=0 is not a preference: the host that installs this runs
          # it on WHATEVER base image the host happens to be, so a binary linked
          # against that runner's glibc is a plugin that starts on the runner and
          # nowhere else. -trimpath keeps the digest a function of the source,
          # not of the checkout path.
          yq -o=json -I=0 '.binaries' hanzo.yml | jq -c '.[]' | while read -r b; do
            name=$(echo "$b"|jq -r .name); main=$(echo "$b"|jq -r '.main // ""')
            lf=$(echo "$b"|jq -r '.ldflags // "-s -w"')
            run=$(echo "$b"|jq -r '.run // ""'); out=$(echo "$b"|jq -r '.out // ""')
            # `run:` + `out:` is the SAME lane for every toolchain that is not Go:
            # the command that builds, and the glob of what it produced. It is why
            # a repo with no Dockerfile and no Go can still publish an artifact —
            # an npm tarball, a wheel, a Rust binary — through this one block.
            # (`image:` also appears on such an entry: it names the toolchain
            # container the PLATFORM lane runs the command in. Here the toolchain
            # is the runner, so this lane reads past it.)
            if [ -n "$run" ]; then
              [ -n "$out" ] || { echo "::error::binaries[$name] declares run: without out: — nothing names what it produced"; exit 1; }
              echo "::group::build $name ($run)"
              sh -c "$run"
              n=0
              for f in $out; do
                [ -f "$f" ] || continue
                base=$(basename "$f"); cp "$f" "dist/$base"
                sha=$(sha256sum "dist/$base" | cut -d' ' -f1)
                # os/arch are "any": an npm tarball or a wheel is not per-platform,
                # and an index entry that claimed one would be a lie a host acts on.
                jq -nc --arg n "$name" --arg os any --arg arch any \
                       --arg url "$BASE/$base" --arg sha "$sha" \
                  '{name:$n,os:$os,arch:$arch,url:$url,sha256:$sha}' >> dist/index.jsonl
                echo "$base  $sha"; n=$((n+1))
              done
              echo "::endgroup::"
              [ "$n" -gt 0 ] || { echo "::error::binaries[$name] out: '$out' matched no file the recipe produced"; exit 1; }
              continue
            fi
            main="${main:-.}"
            echo "$b" | jq -r '(.platforms // ["linux/amd64"])[]' | while read -r plat; do
              os="${plat%%/*}"; arch="${plat##*/}"
              file="${name}-${os}-${arch}"; [ "$os" = windows ] && file="${file}.exe"
              echo "::group::build $name $os/$arch"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "$lf" -o "dist/$file" "$main"
              sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
              jq -nc --arg n "$name" --arg os "$os" --arg arch "$arch" \
                     --arg url "$BASE/$file" --arg sha "$sha" \
                '{name:$n,os:$os,arch:$arch,url:$url,sha256:$sha}' >> dist/index.jsonl
              echo "$file  $sha"
              echo "::endgroup::"
            done
          done
          jq -s --arg repo "$REPO" --arg tag "$TAG" \
            '{repo:$repo,tag:$tag,binaries:.}' dist/index.jsonl > dist/binaries.json
          rm dist/index.jsonl
          if [ "$IS_TAG" != 1 ]; then
            echo "::notice::binaries built for $(jq '.binaries|length' dist/binaries.json) platform(s) — publishing happens on a tag"; exit 0
          fi
          if [ -n "$BUCKET" ]; then
            # Fail closed. An index published without its artifacts is a host
            # that resolves every app to a 404, which is worse than a host with
            # no index at all.
            if [ -z "${S3_ADMIN_ACCESS_KEY:-}" ] || [ -z "${S3_ADMIN_SECRET_KEY:-}" ]; then
              echo "::error::hanzo.yml names bucket: $BUCKET but KMS holds no S3_ADMIN_ACCESS_KEY/SECRET_KEY for this org — refusing to publish"; exit 1
            fi
            # PUT is idempotent, so re-running a release converges on the object
            # rather than colliding with the one already there.
            put() { curl -fsS -X PUT --aws-sigv4 "aws:amz:${S3_REGION:-us-east-1}:s3" \
              -u "$S3_ADMIN_ACCESS_KEY:$S3_ADMIN_SECRET_KEY" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$1" "$BASE/$(basename "$1")" >/dev/null
              echo "published $BASE/$(basename "$1")"; }
            # Artifacts first, index LAST. The index is the only file a host
            # reads, so between the two writes it must never name an object that
            # is not there yet.
            for f in dist/*; do
              [ "$f" = dist/binaries.json ] || put "$f"
            done
            put dist/binaries.json
            # A host reads the index with NO credentials, so prove one can
            # before calling this published — a private object is an index that
            # resolves every app to a 403. Granting read is the BUCKET's job
            # (one policy, once), which is why this checks rather than sets it.
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/binaries.json")
            if [ "$code" != 200 ]; then
              echo "::error::published, but $BASE/binaries.json answers $code unauthenticated — grant s3:GetObject on $BUCKET/* to Principal \"*\" with a bucket policy"; exit 1
            fi
            echo "### Plugin artifacts — \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Index: \`$BASE/binaries.json\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Same token ladder the rest of this file uses: the KMS org token, the
          # org PAT, then the per-job automatic one (which can write a release on
          # its OWN repo, so a repo with no KMS still publishes).
          TOKEN="${GIT_TOKEN:-${GH_PAT:-$GH_AUTOMATIC}}"
          api() { curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' "$@"; }
          rel=$(api "$API/repos/$REPO/releases/tags/$TAG" 2>/dev/null | jq -r '.id // empty' || true)
          if [ -z "$rel" ]; then
            rel=$(api -X POST "$API/repos/$REPO/releases" \
              -d "$(jq -nc --arg t "$TAG" '{tag_name:$t,name:$t,generate_release_notes:true}')" | jq -r .id)
          fi
          for f in dist/*; do
            n=$(basename "$f")
            # Re-running a release must converge, not 422: drop a same-named
            # asset first. The digest in binaries.json is regenerated with it,
            # so the pair can never disagree.
            old=$(api "$API/repos/$REPO/releases/$rel/assets" | jq -r --arg n "$n" '.[]?|select(.name==$n)|.id')
            for id in $old; do api -X DELETE "$API/repos/$REPO/releases/assets/$id" >/dev/null; done
            api -X POST -H 'Content-Type: application/octet-stream' --data-binary @"$f" \
              "$UPLOADS/repos/$REPO/releases/$rel/assets?name=$n" >/dev/null
            echo "published $BASE/$n"
          done
          # The job prints what a host pastes. A digest a human retypes is a
          # digest a human gets wrong.
          {
            echo "### Plugin artifacts — \`$TAG\`"
            echo '```go'
            jq -r '.binaries[]|"zip.Load(zip.Plugin{\n    Name: \"\(.name)\",   // \(.os)/\(.arch)\n    URL:  \"\(.url)\",\n    Sum:  \"\(.sha256)\",\n}, \"/v1/\(.name)\")"' dist/binaries.json
            echo '```'
            echo "Index: \`$BASE/binaries.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish site (per hanzo.yml)
        # The site lane. `images:` ships an OCI image a CLUSTER runs; `binaries:`
        # ships an executable a HOST installs; neither describes a static export
        # that an EDGE serves, which is why this is a third verb and not a flag on
        # one of those two.
        #
        # The plane it publishes onto is hanzoai/cloud's Projects/sites API,
        # whose model is VALUES PLUS A POINTER: a build output is promoted into an
        # immutable Release whose id is a digest of its object manifest, and the
        # site's pointer is flipped to it. `publish` is promote+activate in one
        # call — the 99% path — and rollback is the same pointer aimed at an older
        # release.
        #
        # WHY THIS LANE CHANGED. It used to stage the export with `mc mirror`
        # against hanzoai/s3, gated on S3_ADMIN_ACCESS_KEY + S3_ADMIN_SECRET_KEY
        # read from KMS. Those names are in KMS for NO org, and the step fails
        # closed without them — so `site:` refused every caller that declared one
        # and was dead code no repo could use. Measured before this change: of
        # the 155 hanzo.yml files across the three orgs, NOT ONE carried a
        # `site:` block, and hanzoai/console had grown its own build→zip→publish
        # workflow to ship at all. Per-repo build logic is the one thing this contract exists to
        # prevent, so the fix is not to provision that credential — it is to stop
        # needing it.
        #
        # The bytes now travel the route console proved: the zip goes to
        # /v1/projects/<slug>/deploy and the landed prefix is promoted by
        # /v1/sites/<slug>/publish, both on the IAM bearer the KMS step above
        # ALREADY minted. CI holds no bucket key, names no bucket and names no
        # org — the org segment is prepended server-side from the validated
        # principal, which is what makes the prefix unforgeable. Nothing is left
        # for an org to be missing.
        #
        # THE WORK IS IN bin/sitepublish, NOT HERE. Forty lines of zip → upload →
        # promote → verify inlined in a workflow is forty lines nobody can run
        # offline, and this file already learned that with imgver and gover.
        # bin/sitepublish_test.sh drives it through a curl shim with no network,
        # and is weighted toward the REFUSALS — a publish step that reports
        # success when it verified nothing is worse than one that never verified,
        # because it is indistinguishable from a working one until a site quietly
        # stops updating.
        if: inputs.mode != 'delegate' && github.event_name != 'pull_request'
        env:
          API: ${{ vars.API_ENDPOINT || 'https://api.hanzo.ai' }}
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          # A caller with no `site:` ships no static export, and reading
          # .site.slug off null would abort the step instead of skipping it.
          if [ "$(yq -r '.site | type' hanzo.yml 2>/dev/null || echo '!!null')" != '!!map' ]; then
            echo "::notice::no site: in hanzo.yml — nothing to publish"; exit 0
          fi
          # Same branch gate as deploy.on, including the tag case: a tagged release
          # publishes, a branch publishes only if it is named.
          ON=$(yq -o=json -I=0 '.site.on // []' hanzo.yml)
          IS_TAG=$([ "${{ github.ref_type }}" = "tag" ] && echo 1 || echo 0)
          if [ "$IS_TAG" != 1 ] && ! echo "$ON" | jq -e --arg b "$REF" 'index($b)' >/dev/null; then
            echo "branch $REF not in site.on — skipping publish"; exit 0
          fi
          SLUG=$(yq -r '.site.slug // ""' hanzo.yml)
          DIR=$(yq -r '.site.dir // ""' hanzo.yml)
          BUILD=$(yq -r '.site.build // ""' hanzo.yml)
          if [ -z "$SLUG" ] || [ -z "$DIR" ]; then
            echo "::error::site: needs both slug: (the /v1/sites project) and dir: (the built export)"; exit 1
          fi
          if [ -n "$BUILD" ]; then
            echo "::group::build $SLUG ($BUILD)"
            sh -c "$BUILD"
            echo "::endgroup::"
          fi
          # Fail closed on the ONE thing that can be missing, and say which one.
          # An empty token here means the KMS login did not happen — not that a
          # site credential was never provisioned, which is what the old message
          # said and what sent people looking for a secret that does not exist.
          if [ -z "${HANZO_API_TOKEN:-}" ]; then
            echo "::error::hanzo.yml declares site: but the KMS step minted no IAM token for $API — refusing to publish. That is a KMS_CLIENT_ID/KMS_CLIENT_SECRET problem on this repo, not a missing site credential."; exit 1
          fi
          # Slug grammar, index.html, the server's file/byte caps and the edge
          # BodyLimit are all checked inside sitepublish, before anything is sent,
          # so each refusal names its own number instead of arriving as a 4xx.
          HANZO_API="$API" "$CI_HOME/bin/sitepublish" "$SLUG" "$DIR"


