name: CI/CD
# The gate for hanzoai/ci itself, on our own runners against git.hanzo.ai.
#
# THE LAW: `.github/workflows` does not exist; everything that gates or builds
# lives here. All real config is the repo-root hanzo.yml — this file is the
# ~7-line caller, exactly like cloud/commerce/console/git.
#
# Self-referential on purpose: this repo's dashboard image is built by this
# repo's own reusable pipeline, pinned at the last RELEASE tag rather than at the
# working tree. That pin is what keeps a broken edit to build.yml from also
# breaking the build that would have caught it — it moves only when a release is
# cut, and moving it here is what proves that release before the fleet's @v1
# follows. Named as a role, not a number: the prose said @v2 while the pin below
# read @v1, because a version written into a sentence goes stale on the next one.
on:
  push:
    branches: [main]
    # A v* tag is what produces a published, immutable image tag (branch pushes
    # only ever yield sha-<sha7>). Without this trigger a release tag builds
    # nothing at all and the CR has no version to pin.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1.0.84
    # buildx, because that is what this repo's image can be built by today.
    # `mode: delegate` was measured here on this pin (run 338): the build door
    # answers 403 to the identity a build holds, since its identity path admits
    # an ADMIN of the org and a client-credentials principal is neither a member
    # nor, by cloud's own denial, an admin. The lane presents the right thing and
    # the door has to admit it; until it does, delegating here would only stop
    # this repo's image from being built.
    secrets: inherit
