# Hanzo CI — this repo's own build, driven by this repo's own reusable workflow.
#
# hanzoai/ci is two things that belong together: the reusable pipeline every
# other repo imports (.hanzo/workflows/build.yml), and ci.hanzo.ai, the
# dashboard that shows what that pipeline did. So the dashboard image is built
# by the pipeline it reports on — if the pipeline breaks, the thing that would
# tell you cannot ship, which is the correct and honest coupling.
#
# Until now there was no self-build at all: build.yml is workflow_call-only, so
# the v0.1.0 image was produced out of band and there was no repeatable way to
# cut a second one.
images:
  - name: ci
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/ci

test:
  - name: go-vet
    run: |
      set -e
      export GOWORK=off
      go vet ./...
  - name: go-unit
    # The whole tree, not a named list — an allowlist stops covering whatever is
    # added after it is written. Small repo; ./... costs nothing.
    #
    # scope_test.go is the load-bearing one: it asserts the surface refuses a
    # request with no X-Org-Id and that `?org=` can only narrow. This service
    # shipped once with those properties absent and disclosed every org's build
    # metadata to the internet, so a red gate here must block the image.
    #
    # render_test.go is the other one that has to stay green: it pins the
    # vendored @hanzo/brand sheet to the hash of the version it claims to be and
    # rejects any colour the page names for itself. Both gates are offline —
    # checking that we use one design system costs this pipeline no npm, no
    # registry and no network.
    run: |
      set -e
      export GOWORK=off
      go test -count=1 ./...
  - name: one-definition
    # The pipeline has ONE address: .hanzo/workflows/build.yml. Nothing runs on
    # github.com, so the constraint that used to split this in two — github.com
    # resolves a local reusable only out of `.github/workflows` — no longer buys
    # anything, and the split it forced was costing the forge instead.
    #
    # The forwarder is what broke. A caller naming the forwarder made the forge
    # take a second hop it cannot take: the run expanded into jobs with no labels,
    # no steps and no runner, and reported `failure` with nothing to read. Every
    # cicd lane in the fleet had been red that way for a day — insights, cloud,
    # universe, and this repo — while the deploy lanes, which name their runner
    # directly, stayed green and hid it.
    #
    # So: one file, no hop, and nothing to keep in sync. This asserts the
    # definition is here and holds steps, and that no workflow has reappeared
    # under `.github/workflows` to become a second address.
    run: |
      set -e
      def=.hanzo/workflows/build.yml
      grep -q '^      - name: ' "$def" || {
        echo "::error::$def holds no steps — it is the definition, not a forwarder"; exit 1; }
      grep -q '^    uses: ' "$def" && {
        echo "::error::$def forwards somewhere — the forge cannot take a second hop, that is what this layout removed"; exit 1; } || true
      [ -d .github/workflows ] && {
        echo "::error::.github/workflows is back — nothing runs on github.com and a second address is how the fleet went red"; exit 1; } || true
      echo "OK: one definition ($(wc -l < "$def") lines), no forwarder, no second address"
  - name: gate-runs-before-delegate
    # `mode: delegate` chooses WHERE the image is built. It must never choose
    # WHETHER the commit was tested. It did: the delegate step was evaluated
    # fourth, ahead of every toolchain and ahead of `test:`, and every other step
    # carried `if: inputs.mode != 'delegate'` — so a delegated run skipped the
    # gate along with the build and finished green in seconds having proven
    # nothing. The seam was right and the ORDER was wrong, which is the kind of
    # defect that reads as correct in every diff that touches one step at a time.
    #
    # Two assertions, because either one alone can be satisfied while the gate
    # still does not run: the delegate POST must come AFTER the test gate, and
    # the test gate must not be delegate-guarded.
    run: |
      set -e
      f=.hanzo/workflows/build.yml
      t=$(grep -n '^      - name: Test (per hanzo.yml)$'                       "$f" | cut -d: -f1)
      d=$(grep -n '^      - name: Delegate build to platform (mode=delegate)$' "$f" | cut -d: -f1)
      [ -n "$t" ] && [ -n "$d" ] || { echo "::error::cannot find the test gate ($t) or the delegate step ($d) — a rename broke this assertion, fix the assertion"; exit 1; }
      [ "$d" -gt "$t" ] || { echo "::error::the delegate step (line $d) runs BEFORE the test gate (line $t) — a delegated build would ship an ungated commit"; exit 1; }
      if sed -n "${t}p;$((t+1)),$((t+80))p" "$f" | grep -m1 '^        if: ' | grep -q "mode != 'delegate'"; then
        echo "::error::the test gate is guarded by \`inputs.mode != 'delegate'\` — delegate would skip it"; exit 1
      fi
      echo "OK: test gate at line $t, delegate POST at line $d, gate not delegate-guarded"
  - name: publishable
    # bin/publishable refuses a `build_secrets` name that has not declared itself
    # public. That matters because a build_secret is baked in as a --build-arg,
    # which `docker history` prints to anyone who can pull — so the key is a
    # publishing decision wearing the word "secret". Until this, the only check
    # in the fleet lived inside hanzoai/ui's own Dockerfile, for one image.
    run: bash bin/publishable_test.sh
  - name: publishable-rule-is-one-rule
    # The rule is spelled twice on purpose, and this is what keeps it one rule.
    #
    # build.yml cannot call bin/publishable, because the tools checkout and the
    # workflow resolve from DIFFERENT places: a caller pins the workflow at a ref
    # its own forge resolves, while the tools step derives its ref from
    # GITHUB_WORKFLOW_REF — which git.hanzo.ai does not set, so it falls back to
    # `v1` and clones github.com. Measured on run 36473: `derived ref=v1`,
    # `cloned https://github.com/hanzoai/ci@v1`. So a step calling a NEW file
    # under $CI_HOME is broken on every forge run until a tag moves on a host the
    # caller never named. The pipeline has to carry its own rule.
    #
    # Which leaves the pattern in two files, which is the same shape as the two
    # copies of build.yml and gets the same treatment: demand they are identical
    # and let the gate, not a reader, be the thing that notices.
    run: |
      set -e
      a=$(grep -oE '^[[:space:]]*PUBLISHABLE_\*\|[^)]*\)' .hanzo/workflows/build.yml | tr -d '[:space:]')
      b=$(grep -oE '^[[:space:]]*PUBLISHABLE_\*\|[^)]*\)' bin/publishable          | tr -d '[:space:]')
      [ -n "$a" ] && [ -n "$b" ] || { echo "::error::publishable rule not found in build.yml ($a) or bin/publishable ($b) — an edit renamed it, fix this assertion"; exit 1; }
      [ "$a" = "$b" ] || { echo "::error::the publishable rule differs between build.yml and bin/publishable — build.yml is what runs, bin/publishable is what is tested, so a difference means the tested rule is not the enforced one:
        build.yml:       $a
        bin/publishable: $b"; exit 1; }
      echo "OK: one publishable rule, two spellings — $a"
  - name: imgver
    # bin/imgver decides the version EVERY image in the fleet publishes — this
    # workflow's build lane calls it, and so does the imgver composite action the
    # repos that hand-roll their own deploy.yml use. A wrong number here is one
    # tag covering two digests, which a node running imagePullPolicy:
    # IfNotPresent never picks up and no reader can see. Offline and
    # deterministic: the registry floor is injected, so it needs no network.
    run: bash bin/imgver_test.sh
  - name: vendormark
    # bin/vendormark is the gate the build lane runs against every checkout: it
    # refuses a site-generator vendor's branding in a tracked path, in tracked
    # content, in a commit message, in an author identity or in a Co-authored-by
    # trailer. Five shipped sites carried it — one serving the vendor's upload
    # folder as its favicon — and clearing them took a history rewrite and a
    # force-push of every branch.
    #
    # The suite pins the refusals AND the allowances, and the allowances are the
    # larger half on purpose. The vendor's name is also an ordinary English
    # adjective: across the 1,065 repos swept it appears innocently in tokenizer
    # vocabularies, word lists, ML corpora, packed public-suffix data and an
    # upstream Clerk bundle's list of other people's dev hosts. A gate that reds
    # a fifth of the estate is a gate someone switches off, so the content rules
    # are only strings that cannot occur in prose, and two candidate rules were
    # measured and DROPPED for redding that Clerk bundle. Offline and
    # deterministic: temp repos, no network.
    run: bash bin/vendormark_test.sh
  - name: gover
    # bin/gover is the gate the build lane runs against every Dockerfile before
    # it builds: it refuses a Go builder image older than the go.mod it
    # compiles. That failure is not hypothetical — the golang images set
    # GOTOOLCHAIN=local, so the mismatch is a hard mid-build death, and
    # hanzoai/visor v1.108.16 shipped it. A sweep of the orgs found 54 more
    # Dockerfiles already below their own go.mod.
    #
    # The gate is only worth having if it is exact in BOTH directions: a false
    # negative lets the next visor through, and a false positive blocks a build
    # that would have worked, which is how gates get skipped. So the suite pins
    # the refusals AND the allowances — a newer image than the floor is fine, an
    # alpine suffix is not a Go patch, a floating tag warns instead of failing,
    # and a multi-module repo is judged by its NEAREST go.mod. Offline and
    # deterministic: temp dirs, no registry, no network.
    run: bash bin/gover_test.sh
  - name: sitepublish
    # bin/sitepublish is the whole of the `site:` lane. The lane it replaced was
    # dead: it staged with `mc mirror` behind S3_ADMIN_ACCESS_KEY/SECRET_KEY,
    # names KMS holds for no org, so it failed closed for every caller — and of
    # the 155 hanzo.yml files across the three orgs, not one declared a `site:`.
    #
    # The suite is weighted toward REFUSALS because the failure that matters here
    # is a green publish that verified nothing — indistinguishable from a working
    # one until a site quietly stops updating. Three defects of exactly that
    # shape are pinned by name: an object-shaped read of a body that is not an
    # object, `.releases[]` against the BARE ARRAY the list route returns (which
    # resolves nothing and so can never fail for its stated reason), and
    # `[ "$a" = "$b" ]` on two empty strings, which is TRUE. Reintroducing them
    # turns 3, 9 and 1 of these tests red respectively. Offline and
    # deterministic: a curl shim answers the routes from fixtures, no network.
    run: bash bin/sitepublish_test.sh
  - name: sitedeploy
    # bin/sitedeploy is the other half of the same plane — the per-file presigned
    # route the exports too large for sitepublish's 16 MiB body take — and it is
    # what all 15 static repos reach through the composite action. Its suite was
    # written and then never wired here, so the one tool in bin/ with the widest
    # blast radius was the one tool nothing tested on the way in.
    #
    # What it pins is the part cloud does NOT do for us. On the archive route the
    # server stamps Content-Type and Cache-Control itself; under a presigned POST
    # it stamps neither, because the policy carries no condition for either — so
    # whatever this script sends is what the object keeps, and the cache-control
    # table here is load-bearing rather than advisory. That is why the strings are
    # asserted literally: they are a second spelling of apps/sites.CacheControlFor,
    # and this suite is the only thing that can notice when the two disagree.
    #
    # It also pins the edge body limit from BOTH sides, which is the only way a
    # size check earns its place: over it, the completion manifest is refused
    # before a single request goes out; at exactly it, the publish still happens.
    # A guard that can only refuse is a guard that eventually blocks a build that
    # would have worked, and those are the ones people learn to route around.
    # Offline and deterministic: SITEDEPLOY_PLAN prints the manifest, no network.
    run: bash bin/sitedeploy_test.sh
  - name: conflictmarkers
    # bin/conflictmarkers runs against every repo in the fleet, so a false
    # positive is as expensive as a miss: it blocks a build that would have
    # worked, on a file the author cannot legally change. hanzoai/code is that
    # case — VOID_CODEBASE_GUIDE.md documents Void's Search/Replace format,
    # which deliberately spells itself the way git writes a conflict, and the
    # escape used everywhere else here (indent it) would change what the page
    # renders. So the suite pins BOTH directions: the .d.ts and unfenced-
    # markdown conflicts still fail, and a fenced sample, a tilde fence,
    # hanzoai/app's same-line fixture and an eight-bracket heredoc still pass.
    # Offline and deterministic: git repos in temp dirs, no network.
    run: bash bin/conflictmarkers_test.sh

# No `deploy:` key exists any more — for any repo. A build ends at a published
# image; what RUNS is a reviewed pin in hanzo/universe, which cd.hanzo.ai reads.
# A pipeline that both builds and rolls itself out can put an unreviewed image
# on a public host, and cd's selfHeal would undo a direct patch anyway.

