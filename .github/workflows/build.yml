# The reusable answers at TWO addresses, and this is the second one.
#
# 67 repos call `hanzoai/ci/.hanzo/workflows/build.yml@v1` and 32 call
# `hanzoai/ci/.github/workflows/build.yml@v1`. Both are live, so both paths must
# resolve — but only ONE may hold the logic. While this file held a COPY of it the
# two drifted within the hour: a fix landed at one address and every repo reading
# the other kept running the old behaviour, green, for as long as nobody thought to
# diff two files that are supposed to be identical. That is how the KMS org mapping
# came to be right at one address and wrong at the other, with hanzoai/cloud reading
# the wrong one.
#
# So this FORWARDS instead of repeating. `.hanzo/workflows/build.yml` is the single
# definition; everything below exists to carry a caller's values across one hop.
#
# The defaults ARE restated here, and that is not an oversight. An input a caller
# omits arrives at `${{ inputs.x }}` as the empty string, and passing an empty
# string through `with:` OVERRIDES the callee's default rather than falling back to
# it — so a forwarder that declared no defaults would quietly send `runner: ''` and
# schedule every build against no labels at all. Four values restated is the price
# of the hop; 1,800 lines restated was the bug.
name: Hanzo CI/CD

on:
  workflow_call:
    inputs:
      runner:
        description: Forwarded — see .hanzo/workflows/build.yml for what it means.
        type: string
        default: '["hanzo-build-linux-amd64"]'
      mode:
        description: Forwarded — see .hanzo/workflows/build.yml for what it means.
        type: string
        default: buildx
      tests:
        description: Forwarded — see .hanzo/workflows/build.yml for what it means.
        type: string
        default: 'true'
      submodules:
        description: Forwarded — see .hanzo/workflows/build.yml for what it means.
        type: string
        default: ''

jobs:
  cicd:
    uses: ./.hanzo/workflows/build.yml
    # The original caller reached this file with `secrets: inherit`; the same word
    # carries that inheritance down the second hop, so the real workflow sees the
    # credentials that caller offered and no secret is ever named twice.
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      mode: ${{ inputs.mode }}
      tests: ${{ inputs.tests }}
      submodules: ${{ inputs.submodules }}
