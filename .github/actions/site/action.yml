name: site
description: Publish a built static export to the Hanzo PaaS Sites plane.
# For every repo whose deploy is "a static export goes live" — hanzo.ai, hanzo.app,
# hips, computer and the ones after them. Those were each about to carry their own
# copy of enqueue → upload → complete, which is how one contract becomes N
# transcriptions that drift (see the imgver action next door for the same story
# told about image tags).
#
#   - uses: hanzoai/ci/.github/actions/site@v1
#     with:  { slug: hanzo-ai, dir: out }
#     env:
#       KMS_CLIENT_ID:     '${{ secrets.KMS_CLIENT_ID }}'
#       KMS_CLIENT_SECRET: '${{ secrets.KMS_CLIENT_SECRET }}'
#
# A SITE IS NOT AN APP. This publishes files and stops: no image, no CR, no
# replicas, no registry. Building a container so a Go binary can serve /public is
# the shape the Sites plane exists to retire.
#
# ONE credential, read from ONE place. The deploy key comes from KMS, which is
# where a secret lives: it rotates by resealing, and every site that publishes
# reads the same value the moment it changes. It was `secrets.HANZO_DEPLOY_TOKEN`
# on Hanzo Git — one copy per org that nobody can read back, so nobody could tell
# it had stopped resolving, and cloud answered 403 on every call for the repos
# still carrying it while the one repo that had moved to KMS published fine.
#
# The 202 hands back a prefix-scoped, 30-minute presigned POST grant on top of
# that, so CI never holds a bucket key — do NOT add SITES_S3_* here; that is the
# standing shared-bucket credential the grant replaced.
inputs:
  slug:
    description: The project slug on the Sites plane (POST /v1/projects/<slug>/deployments)
    required: false
    default: ''
  dir:
    description: The built export directory
    required: false
    default: ''
  sites:
    description: >-
      Several sites from one build, one `slug=dir` pair per line. A white-labelled
      product is one codebase and several hosts, and a site keys on its HOST — so
      a brand per host is a site per host, and one build writes an export per
      brand. bin/site stays single-site: a publish IS one site, and which
      sites to publish is orchestration, which is what this file is.
    required: false
    default: 
  api:
    description: Cloud API base
    required: false
    default: https://api.hanzo.ai
  kms:
    description: KMS base, which holds the deploy key
    required: false
    default: https://kms.hanzo.ai
  jobs:
    description: Parallel uploads
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - name: Fetch site
      shell: bash
      # The action ref is the script ref: an action pinned to @v1 runs v1's
      # site. Both hosts, because this repo is served from each.
      run: |
        set -euo pipefail
        ref="${GITHUB_ACTION_REF:-v1}"
        # The break tests for the TOOL, not for the clone: a host that answers
        # with a tree carrying no bin/site must fall through to the next
        # one rather than break and dead-end the job on it.
        for url in https://git.hanzo.ai/hanzoai/ci https://github.com/hanzoai/ci; do
          git clone -q --depth 1 --branch "$ref" "$url" "$RUNNER_TEMP/site-ci" 2>/dev/null \
            && [ -x "$RUNNER_TEMP/site-ci/bin/site" ] && break
          rm -rf "$RUNNER_TEMP/site-ci"
        done
        [ -x "$RUNNER_TEMP/site-ci/bin/site" ] \
          || { echo "::error::could not fetch hanzoai/ci@$ref (bin/site)"; exit 1; }

    - name: Read the deploy key
      id: key
      shell: bash
      env:
        KMS: ${{ inputs.kms }}
      # No -f: curl's --fail exits 22 and prints nothing an operator can act on,
      # which is the same silence an absent secret gives. Read the body and test
      # the field, so a refusal says WHICH of the two it was.
      #
      # The read is FLAT. KMS resolves a name at the credential's own scope root,
      # so `HANZO_DEPLOY_TOKEN` finds the value sealed for this org — while a
      # path-qualified name like `deploy/HANZO_DEPLOY_TOKEN` finds nothing and
      # reads exactly like an absent secret.
      #
      # ASK AGAIN, AND SAY WHAT CAME BACK. A gateway timeout is not a refusal and
      # it is not a missing secret, and this step used to report it as neither:
      # the body was piped straight into jq, so an edge answering `error code:
      # 524` in plain text killed the step at `Invalid numeric literal at line 1,
      # column 6` with `set -e`, before either `::error::` line below could run.
      # Every site publish in the estate reads its token here, so one minute of
      # edge trouble stopped all of them and the log named jq.
      #
      # So: capture the code and the body separately, retry the codes that mean
      # "ask again" (nothing arrived, or the edge answered for the origin), and
      # parse only what is JSON. A 5xx now reads as an outage, a 401 as a
      # credential, an empty field as an unsealed secret — three different
      # sentences for three different problems.
      run: |
        set -euo pipefail
        # $1 name, $2 url, rest: curl args. Echoes the body on success.
        ask() {
          local what=$1 url=$2; shift 2
          local code body
          for wait in 0 5 15 45; do
            [ "$wait" = 0 ] || sleep "$wait"
            code=$(curl -sS -m 30 -o /tmp/kms.body -w '%{http_code}' "$url" "$@" || echo 000)
            case "$code" in
              2*) cat /tmp/kms.body; return 0 ;;
              000|429|5*) continue ;;
              *) echo "::error::KMS refused the $what: HTTP $code from $url — $(head -c 300 /tmp/kms.body)" >&2; return 1 ;;
            esac
          done
          echo "::error::KMS did not answer the $what: HTTP $code from $url over four tries — $(head -c 300 /tmp/kms.body). This is an outage, not a missing secret." >&2
          return 1
        }
        val() { jq -r --arg f "$1" '.[$f] // ""' 2>/dev/null || true; }
        kt=$(ask login "$KMS/v1/kms/auth/login" -H 'Content-Type: application/json' \
               -d "{\"clientId\":\"${KMS_CLIENT_ID:-}\",\"clientSecret\":\"${KMS_CLIENT_SECRET:-}\"}" | val accessToken)
        [ -n "$kt" ] || { echo "::error::KMS login returned no accessToken at $KMS/v1/kms/auth/login — set KMS_CLIENT_ID and KMS_CLIENT_SECRET on this step (org-level secrets on git.hanzo.ai)"; exit 1; }
        key=$(ask secret "$KMS/v1/kms/secrets/HANZO_DEPLOY_TOKEN?env=prod" -H "Authorization: Bearer $kt" | val value)
        [ -n "$key" ] || { echo "::error::no HANZO_DEPLOY_TOKEN at $KMS/v1/kms/secrets/HANZO_DEPLOY_TOKEN?env=prod — seal a live sk- key there"; exit 1; }
        # Masked before it is ever an output, so it cannot surface in a log.
        echo "::add-mask::$key"
        echo "token=$key" >> "$GITHUB_OUTPUT"

    - name: Deploy
      shell: bash
      env:
        HANZO_API: ${{ inputs.api }}
        HANZO_DEPLOY_TOKEN: ${{ steps.key.outputs.token }}
        SITE_JOBS: ${{ inputs.jobs }}
        SITE_COMMIT: ${{ github.sha }}
        SITE_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        pairs='${{ inputs.sites }}'
        [ -n "${pairs//[[:space:]]/}" ] || pairs='${{ inputs.slug }}=${{ inputs.dir }}'
        if [ "${pairs//[[:space:]]/}" = "=" ]; then
          echo "::error::nothing to publish: pass slug: and dir:, or sites: with one slug=dir per line."
          exit 1
        fi
        # A file, not a pipe. The loop body runs curl, curl inherits stdin, and
        # it would swallow the rest of the list — publishing the first site and
        # reporting success for all of them.
        printf '%s\n' "$pairs" > "$RUNNER_TEMP/site-pairs"
        n=0
        while IFS= read -r pair; do
          [ -n "${pair//[[:space:]]/}" ] || continue
          case "$pair" in *=*) ;; *) echo "::error::sites: entry '$pair' is not slug=dir"; exit 1 ;; esac
          echo "::group::publish ${pair%%=*}"
          bash "$RUNNER_TEMP/site-ci/bin/site" "${pair%%=*}" "${pair#*=}"
          echo "::endgroup::"
          n=$((n + 1))
        done < "$RUNNER_TEMP/site-pairs"
        [ "$n" -gt 0 ] || { echo "::error::sites: named no site"; exit 1; }
