name: site
description: Publish a built static export to the Hanzo PaaS Sites plane.
# For every repo whose deploy is "a static export goes live" — hanzo.ai, hanzo.app,
# hips, computer and the ones after them. Those were each about to carry their own
# copy of enqueue → upload → complete, which is how one contract becomes N
# transcriptions that drift (see the imgver action next door for the same story
# told about image tags).
#
#   - uses: hanzoai/ci/.github/actions/site@v1
#     with:  { slug: hanzo-ai, dir: out }
#     env:
#       KMS_CLIENT_ID:     '${{ secrets.KMS_CLIENT_ID }}'
#       KMS_CLIENT_SECRET: '${{ secrets.KMS_CLIENT_SECRET }}'
#
# A SITE IS NOT AN APP. This publishes files and stops: no image, no CR, no
# replicas, no registry. Building a container so a Go binary can serve /public is
# the shape the Sites plane exists to retire.
#
# ONE credential, read from ONE place. The deploy key comes from KMS, which is
# where a secret lives: it rotates by resealing, and every site that publishes
# reads the same value the moment it changes. It was `secrets.HANZO_DEPLOY_TOKEN`
# on Hanzo Git — one copy per org that nobody can read back, so nobody could tell
# it had stopped resolving, and cloud answered 403 on every call for the repos
# still carrying it while the one repo that had moved to KMS published fine.
#
# The 202 hands back a prefix-scoped, 30-minute presigned POST grant on top of
# that, so CI never holds a bucket key — do NOT add SITES_S3_* here; that is the
# standing shared-bucket credential the grant replaced.
inputs:
  slug:
    description: The project slug on the Sites plane (POST /v1/projects/<slug>/deployments)
    required: false
    default: ''
  dir:
    description: The built export directory
    required: false
    default: ''
  sites:
    description: >-
      Several sites from one build, one `slug=dir` pair per line. A white-labelled
      product is one codebase and several hosts, and a site keys on its HOST — so
      a brand per host is a site per host, and one build writes an export per
      brand. bin/site stays single-site: a publish IS one site, and which
      sites to publish is orchestration, which is what this file is.
    required: false
    default: 
  api:
    description: Cloud API base
    required: false
    default: https://api.hanzo.ai
  kms:
    description: KMS base, which holds the deploy key
    required: false
    default: https://kms.hanzo.ai
  jobs:
    description: Parallel uploads
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - name: Fetch site
      shell: bash
      env:
        # The forge stopped serving git anonymously, so this clone needs a
        # credential. The job's own token is the one it already has.
        FORGE_TOKEN_FOR_CLONE: ${{ github.token }}
      # The action ref is the script ref: an action pinned to @v1 runs v1's
      # site. Both hosts, because this repo is served from each.
      #
      # BOTH HOSTS NEEDED FIXING, in different ways, and between them they froze
      # every static site in the estate for eleven hours — hanzo.ai, hips,
      # hanzo.app and agency all publish through this one step, and it failed in
      # ONE SECOND with the build and every gate green above it.
      #
      #   git.hanzo.ai refuses ANONYMOUS git. `GET /<any repo>/info/refs` is 401
      #   even for a repo the API reports `private: false`, so a bare clone dies
      #   on "could not read Username" — which on a runner with no tty is an
      #   instant failure, not a prompt. Hence the token below.
      #
      #   The github.com fallback was NOT a fallback. An `insteadOf` rewrite
      #   mapping https://github.com/hanzoai/ -> https://git.hanzo.ai/hanzoai/
      #   is standard on our machines, and git applies it to the URL this loop
      #   passes — so the "second host" resolved to the FIRST one, the same one
      #   that had just refused, and the loop tried a single host twice. The
      #   giveaway is a clone of a github.com URL failing with git.hanzo.ai in
      #   the error text. `-c url...insteadOf=` does not undo it (an empty value
      #   does not remove the rule), so the fallback runs with the global and
      #   system config OUT, which is the only reliable way to mean "this URL,
      #   literally".
      run: |
        set -euo pipefail
        ref="${GITHUB_ACTION_REF:-v1}"
        dst="$RUNNER_TEMP/site-ci"
        export GIT_TERMINAL_PROMPT=0

        # The token rides a header, never the URL: a credential in a remote is
        # written into .git/config and printed by any later `git remote -v`.
        auth=$(printf 'x-access-token:%s' "${FORGE_TOKEN_FOR_CLONE:-}" | base64 -w0)

        forge() { git -c "http.extraheader=Authorization: Basic $auth" \
                    clone -q --depth 1 --branch "$ref" \
                    https://git.hanzo.ai/hanzoai/ci "$dst" 2>/dev/null; }
        mirror() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
                    git clone -q --depth 1 --branch "$ref" \
                    https://github.com/hanzoai/ci "$dst" 2>/dev/null; }

        # The test is for the TOOL, not for the clone: a host that answers with a
        # tree carrying no bin/site must fall through rather than dead-end on it.
        for try in forge mirror; do
          "$try" && [ -x "$dst/bin/site" ] && break
          rm -rf "$dst"
        done
        [ -x "$dst/bin/site" ] \
          || { echo "::error::could not fetch hanzoai/ci@$ref (bin/site) from git.hanzo.ai or github.com"; exit 1; }

    - name: Read the deploy key
      id: key
      shell: bash
      env:
        # Only the endpoint. KMS_CLIENT_ID/SECRET arrive in the environment of the
        # step that invoked this action and are inherited — which is how the copy
        # this replaces read them, and re-declaring them from the `env` context
        # would resolve to empty here.
        KMS_ENDPOINT: ${{ inputs.kms }}
      # bin/kms, the same clone this job already fetched for bin/site. The
      # retry, the flat name and the three distinct failure messages live there,
      # once, because they were written here and in build.yml and in hanzoai/gui
      # and were wrong in three different ways at the same time.
      run: |
        set -euo pipefail
        key=$(bash "$RUNNER_TEMP/site-ci/bin/kms" HANZO_DEPLOY_TOKEN prod)
        # Masked before it is ever an output, so it cannot surface in a log.
        echo "::add-mask::$key"
        echo "token=$key" >> "$GITHUB_OUTPUT"

    - name: Deploy
      shell: bash
      env:
        HANZO_API: ${{ inputs.api }}
        HANZO_DEPLOY_TOKEN: ${{ steps.key.outputs.token }}
        SITE_JOBS: ${{ inputs.jobs }}
        SITE_COMMIT: ${{ github.sha }}
        SITE_BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        pairs='${{ inputs.sites }}'
        [ -n "${pairs//[[:space:]]/}" ] || pairs='${{ inputs.slug }}=${{ inputs.dir }}'
        if [ "${pairs//[[:space:]]/}" = "=" ]; then
          echo "::error::nothing to publish: pass slug: and dir:, or sites: with one slug=dir per line."
          exit 1
        fi
        # A file, not a pipe. The loop body runs curl, curl inherits stdin, and
        # it would swallow the rest of the list — publishing the first site and
        # reporting success for all of them.
        printf '%s\n' "$pairs" > "$RUNNER_TEMP/site-pairs"
        n=0
        while IFS= read -r pair; do
          [ -n "${pair//[[:space:]]/}" ] || continue
          case "$pair" in *=*) ;; *) echo "::error::sites: entry '$pair' is not slug=dir"; exit 1 ;; esac
          echo "::group::publish ${pair%%=*}"
          bash "$RUNNER_TEMP/site-ci/bin/site" "${pair%%=*}" "${pair#*=}"
          echo "::endgroup::"
          n=$((n + 1))
        done < "$RUNNER_TEMP/site-pairs"
        [ "$n" -gt 0 ] || { echo "::error::sites: named no site"; exit 1; }
